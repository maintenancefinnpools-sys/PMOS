<style>
.customer-layout{display:grid;grid-template-columns:minmax(245px,310px) minmax(0,1fr);gap:18px;align-items:start}.customer-browser{padding:0;overflow:hidden;position:sticky;top:0;max-height:calc(100vh - 145px);display:flex;flex-direction:column}.customer-browser-head{padding:18px 18px 13px;border-bottom:1px solid var(--border)}.customer-browser-head h2{margin:0;font-size:17px;font-weight:900}.customer-browser-head p{margin:4px 0 12px;color:var(--muted);font-size:12px}.customer-search{width:100%;min-height:41px;border:1px solid var(--border);border-radius:8px;background:#fff;padding:9px 11px;color:var(--text)}.customer-search:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px rgba(1,125,177,.16)}.customer-count{padding:9px 18px 7px;color:var(--muted);font-size:11px;font-weight:700}.customer-results{min-height:180px;overflow:auto;padding:0 8px 12px}.customer-result{display:block;width:100%;padding:10px 11px;border:0;border-left:3px solid transparent;border-radius:8px;background:transparent;color:var(--text);text-align:left;cursor:pointer}.customer-result:hover{background:var(--surface-soft)}.customer-result.active{border-left-color:var(--brand);background:#eaf4f8}.customer-result strong,.customer-result span{display:block}.customer-result strong{font-size:13px;font-weight:900}.customer-result span{margin-top:3px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.customer-profile-pane{min-width:0}.customer-profile-empty{min-height:360px;display:grid;place-items:center;text-align:center}.customer-profile-empty h2{margin:0 0 7px;font-size:22px}.customer-profile-empty p{max-width:430px;margin:0;color:var(--muted);line-height:1.55}.customer-profile{padding:0;overflow:hidden}.customer-profile[hidden]{display:none}.customer-profile-hero{display:flex;align-items:flex-start;gap:14px;padding:22px 24px;background:var(--surface-soft);border-bottom:1px solid var(--border)}.customer-avatar{width:54px;height:54px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:#dcecf3;color:var(--brand-dark);font-size:18px;font-weight:900}.customer-profile-identity{min-width:0;flex:1}.customer-profile-identity h2{margin:0;font-size:25px;font-weight:900}.customer-profile-subline{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:5px;color:var(--muted);font-size:11px}.customer-status{padding:4px 8px;border-radius:999px;background:#dcecf3;color:var(--brand-dark);font-size:10px;font-weight:900}.customer-status.paused{background:#f7edce;color:#795c17}.customer-status.inactive{background:#eceff1;color:#627078}.customer-status.off{background:#eceff1;color:#627078}.customer-profile-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.customer-profile-actions button{padding:8px 10px;border:1px solid #aac1cb;border-radius:7px;background:#fff;color:var(--brand-dark);font:inherit;font-size:10px;font-weight:900;cursor:pointer}.customer-profile-actions button.primary{border-color:var(--brand-dark);background:var(--brand-dark);color:#fff}.customer-profile-body{padding:20px 24px 26px}.customer-contact-grid{display:grid;grid-template-columns:1.5fr .8fr 1.1fr;gap:10px}.customer-info-card{min-width:0;padding:13px 14px;border:1px solid var(--border);border-radius:9px;background:#fff}.customer-label{color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.customer-value{margin-top:5px;color:var(--text);font-size:12px;line-height:1.45;word-break:break-word}.customer-link{color:var(--brand-dark);text-decoration:none}.customer-link:hover{text-decoration:underline}.customer-section{margin-top:20px}.customer-section-title{margin:0 0 9px;font-size:16px;font-weight:900}.customer-summary{padding:13px 14px;border:1px solid var(--border);border-radius:9px;background:#fff}.customer-summary-line{font-size:12px;line-height:1.55}.customer-summary-line+.customer-summary-line{margin-top:5px}.customer-location-list{display:grid;gap:8px}.customer-location{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(90px,.5fr) minmax(90px,.55fr);align-items:center;gap:12px;width:100%;padding:11px 13px;border:1px solid var(--border);border-left:4px solid #9cb0b9;border-radius:9px;background:#fff;color:var(--text);text-align:left;cursor:pointer}.customer-location:hover{background:var(--surface-soft);border-left-color:var(--brand)}.customer-location.active{border-color:#8fc4da;border-left-color:var(--brand);background:#eaf6fb}.customer-location strong,.customer-location span{display:block}.customer-location strong{font-size:12px;font-weight:900}.customer-location .address{margin-top:3px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.customer-location .meta{color:var(--muted);font-size:9px}.customer-location .meta b{display:block;margin-top:3px;color:var(--text);font-size:10px}.customer-primary-badge,.customer-contact-primary{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;background:#dcefdc;color:#356443;font-size:8px;font-weight:900;text-transform:uppercase}.customer-route-list{display:grid;gap:7px;margin-top:9px}.customer-route{padding:9px 11px;border-radius:8px;background:var(--surface-detail);font-size:11px;line-height:1.45}.customer-body-list{display:grid;gap:8px}.customer-body-card{border:1px solid var(--border);border-radius:9px;background:#fff;overflow:hidden}.customer-body-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 14px;border:0;background:#fff;color:var(--text);text-align:left;cursor:pointer}.customer-body-toggle:hover{background:var(--surface-soft)}.customer-body-toggle strong{font-size:12px;font-weight:900}.customer-body-toggle span{color:var(--brand-dark);font-size:10px;font-weight:900}.customer-body-details{display:none;padding:12px 14px 14px;border-top:1px solid var(--border);background:var(--surface-soft)}.customer-body-card.open .customer-body-details{display:block}.customer-detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.customer-detail{padding:9px;border-radius:7px;background:#fff}.customer-detail b,.customer-detail span{display:block}.customer-detail b{color:var(--muted);font-size:9px;text-transform:uppercase}.customer-detail span{margin-top:4px;font-size:11px}.customer-equipment-list{display:grid;gap:6px;margin-top:9px}.customer-equipment-item{padding:8px 9px;border-radius:7px;background:#fff;font-size:11px;line-height:1.45}.customer-contact-list{display:grid;gap:7px}.customer-contact-row{display:grid;grid-template-columns:minmax(150px,.85fr) minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;padding:10px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:11px}.customer-contact-row.primary{background:#e9eef0;border-color:#bccad0}.customer-contact-row strong{font-weight:900}.customer-contact-row a{min-width:0;color:var(--brand-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}.customer-contact-row a:hover{text-decoration:underline}.customer-contact-role{margin-top:2px;color:var(--muted);font-size:9px}.customer-notes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.customer-note{padding:13px 14px;border:1px solid var(--border);border-radius:9px;background:#fff}.customer-note p{margin:6px 0 0;white-space:pre-wrap;font-size:12px;line-height:1.55}.customer-loading{padding:18px;color:var(--muted);text-align:center;font-size:12px}.customer-muted{color:var(--muted)}
@media(max-width:980px){.customer-layout{grid-template-columns:1fr}.customer-browser{position:static;max-height:330px}.customer-contact-grid,.customer-detail-grid{grid-template-columns:1fr}.customer-notes-grid{grid-template-columns:1fr}.customer-location{grid-template-columns:1fr}}
@media(max-width:620px){.customer-profile-hero,.customer-profile-body{padding-left:16px;padding-right:16px}.customer-profile-hero{flex-wrap:wrap}.customer-profile-actions{width:100%;justify-content:flex-start}.customer-contact-row{grid-template-columns:1fr}}
</style>

<section class="view" id="view-customers">
  <div class="customer-layout">
    <aside class="panel customer-browser">
      <div class="customer-browser-head"><h2>Customer Look-Up</h2><p>Search an account, service location, address, phone, email, or Customer ID.</p><input id="customerSearch" class="customer-search" type="search" autocomplete="off" placeholder="Search customers"></div>
      <div id="customerCount" class="customer-count">Select Customer Look-Up to load customers.</div><div id="customerResults" class="customer-results"></div>
    </aside>
    <div class="customer-profile-pane">
      <div id="customerProfileEmpty" class="panel customer-profile-empty"><div><h2>Find a customer</h2><p>Select a customer account to open its PMOS profile.</p></div></div>
      <article id="customerProfile" class="panel customer-profile" hidden>
        <div class="customer-profile-hero"><div id="customerAvatar" class="customer-avatar">—</div><div class="customer-profile-identity"><h2 id="customerProfileName"></h2><div class="customer-profile-subline"><span id="customerProfileLocation"></span><span id="customerProfileId"></span><span id="customerProfileStatus" class="customer-status"></span></div></div><div class="customer-profile-actions"><button id="customerAddLocation" type="button">Add Service Location</button><button id="customerEdit" class="primary" type="button">Edit Customer</button></div></div>
        <div id="customerProfileBody" class="customer-profile-body"></div>
      </article>
    </div>
  </div>
</section>

<script>
(function(){
  'use strict';
  const state={loaded:false,rows:[],selectedSidebarId:'',selectedLocationId:'',timer:null,listRequest:0,profileRequest:0,profile:null};
  const $=id=>document.getElementById(id);
  function server(name,...args){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error&&error.message?error.message:String(error))));runner[name](...args);});}
  function esc(value){return String(value==null?'':value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
  function safeArray(value){return Array.isArray(value)?value:[];}
  function initials(name){return String(name||'').split(/[\s,]+/).filter(Boolean).slice(0,2).map(part=>part.charAt(0).toUpperCase()).join('')||'—';}
  function mapHref(address){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(String(address||''));}
  function telHref(phone){return 'tel:'+String(phone||'').replace(/[^+\d]/g,'');}
  function mailHref(email){return 'mailto:'+encodeURIComponent(String(email||''));}
  function humanType(type){const labels={CHEMISTRY_AUTOMATION:'Chemistry Automation',EQUIPMENT_AUTOMATION:'Equipment Automation',ACID_TANK:'Acid Tank',CHLORINE_TANK:'Chlorine Tank',PH_PROBE:'pH Probe',ORP_PROBE:'ORP Probe',SOLAR_BOOSTER_PUMP:'Solar Booster Pump',SOLAR_VALVE_ACTUATOR:'Solar Valve Actuator',SOLAR_AUTOMATION:'Solar Automation',SALT_SYSTEM:'Salt Cell',CHLORINE_FEEDER:'Chlorinator',BROMINE_FEEDER:'Brominator',WATER_FEATURE:'Water Feature',OTHER_SANITIZER:'Other Sanitizer',OZONATOR:'Ozonator',UV:'UV Light',ROBOT:'Robot',PUMP:'Pump',FILTER:'Filter',HEATER:'Heater'};return labels[type]||String(type||'Equipment').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}
  function valueCard(label,value,href){if(!value)return '';const content=href?`<a class="customer-link" href="${esc(href)}" target="_blank" rel="noopener">${esc(value)}</a>`:esc(value);return `<div class="customer-info-card"><div class="customer-label">${esc(label)}</div><div class="customer-value">${content}</div></div>`;}
  async function loadCustomers(query){const request=++state.listRequest;$('customerCount').textContent='Loading customers…';$('customerResults').innerHTML='<div class="customer-loading">Loading…</div>';try{const rows=await server('searchPmosCustomerAccountProfiles',query||'');if(request!==state.listRequest)return;state.loaded=true;state.rows=safeArray(rows);renderResults();}catch(error){if(request!==state.listRequest)return;$('customerCount').textContent='Customer list unavailable';$('customerResults').innerHTML=`<div class="customer-loading">${esc(error.message)}</div>`;}}
  function renderResults(){const rows=state.rows;$('customerCount').textContent=`${rows.length} customer account${rows.length===1?'':'s'}`;$('customerResults').innerHTML=rows.length?rows.map(row=>{const meta=[row.address,row.sidebarMeta].filter(Boolean).join(' · ');return `<button class="customer-result${row.customerId===state.selectedSidebarId?' active':''}" data-customer-id="${esc(row.customerId)}"><strong>${esc(row.listName||row.displayName||row.customerId)}</strong><span>${esc(meta||row.phone||row.email||'')}</span></button>`;}).join(''):'<div class="customer-loading">No matching customers.</div>';document.querySelectorAll('.customer-result').forEach(button=>button.onclick=()=>selectCustomer(button.dataset.customerId,button.dataset.customerId));}
  async function selectCustomer(sidebarId,locationId){const request=++state.profileRequest;state.selectedSidebarId=String(sidebarId||'');state.selectedLocationId=String(locationId||sidebarId||'');renderResults();$('customerProfileEmpty').hidden=false;$('customerProfileEmpty').innerHTML='<div class="customer-loading">Loading customer profile…</div>';$('customerProfile').hidden=true;try{const profile=await server('getPmosWebCustomerProfile',state.selectedLocationId);if(request!==state.profileRequest)return;state.profile=profile;renderProfile(profile);}catch(error){if(request!==state.profileRequest)return;$('customerProfileEmpty').innerHTML=`<div><h2>Profile unavailable</h2><p>${esc(error.message)}</p></div>`;}}
  function renderLocations(profile){const locations=safeArray(profile.serviceLocations);if(!locations.length)return '';return `<section class="customer-section" style="margin-top:0"><h3 class="customer-section-title">Service Locations</h3><div class="customer-location-list">${locations.map(location=>{const name=location.locationName||location.calendarTitle||'Service Location',badge=location.primary?'<span class="customer-primary-badge">Primary</span>':'',frequency=location.frequency||'Not on maintenance',status=location.frequency?(location.status||'Active'):'Not enrolled';return `<button type="button" class="customer-location${String(location.customerId)===String(profile.customerId)?' active':''}" data-location-id="${esc(location.customerId)}"><div><strong>${esc(name)}${badge}</strong><span class="address">${esc(location.address||'')}</span></div><span class="meta">Service<b>${esc(frequency)}</b></span><span class="meta">Status<b>${esc(status)}</b></span></button>`;}).join('')}</div></section>`;}
  function renderContactRows(contacts,location){return safeArray(contacts).map(contact=>{const name=[contact.firstName,contact.lastName].filter(Boolean).join(' ')||contact.role||'Contact',role=contact.primary?'Primary Account Contact':(contact.role||''),phone=contact.phone?`<a href="${esc(telHref(contact.phone))}">${esc(contact.phone)}</a>`:'<span class="customer-muted">No phone</span>',email=contact.email?`<a href="${esc(mailHref(contact.email))}">${esc(contact.email)}</a>`:'<span class="customer-muted">No email</span>';return `<div class="customer-contact-row${contact.primary?' primary':''}"><div><strong>${esc(name)}</strong>${contact.primary?'<span class="customer-contact-primary">Primary</span>':''}${role&&!contact.primary?`<div class="customer-contact-role">${esc(role)}</div>`:''}</div>${phone}${email}</div>`;}).join('');}
  function renderContacts(profile){const account=safeArray(profile.accountContacts),local=safeArray(profile.serviceLocationContacts);let html='';if(account.length)html+=`<section class="customer-section"><h3 class="customer-section-title">Account Contacts</h3><div class="customer-contact-list">${renderContactRows(account,false)}</div></section>`;if(local.length)html+=`<section class="customer-section"><h3 class="customer-section-title">Service Location Contacts</h3><div class="customer-contact-list">${renderContactRows(local,true)}</div></section>`;return html;}
  function renderBilling(profile){const b=profile.accountBillingAddress||{};if(!b.enabled)return '';const address=[[b.addressLine1,b.addressLine2].filter(Boolean).join(', '),b.city,b.province,b.postalCode,b.country].filter(Boolean).join(', ');return `<section class="customer-section"><h3 class="customer-section-title">Account Billing Address</h3><div class="customer-summary"><div class="customer-summary-line">${esc(address)}</div></div></section>`;}
  function renderMaintenance(profile){const wm=profile.waterMaintenance||{};if(!wm.enabled)return `<section class="customer-section"><h3 class="customer-section-title">Water Maintenance</h3><div class="customer-summary"><div class="customer-summary-line"><b>Not enrolled.</b> This property can still be used for Service Calls, Openings / Closings and other PMOS work. Use Edit Customer to add recurring Water Maintenance.</div></div></section>`;const routes=safeArray(profile.routes),lines=[`<div class="customer-summary-line"><b>Status:</b> ${esc(wm.status||'Active')}</div>`,`<div class="customer-summary-line"><b>Frequency:</b> ${esc(wm.frequency||profile.frequency||'')}</div>`];if(wm.serviceStartDate)lines.push(`<div class="customer-summary-line"><b>Service start:</b> ${esc(wm.serviceStartDate)}</div>`);if(wm.yearRound)lines.push(`<div class="customer-summary-line"><b>Season:</b> ${esc(wm.yearRound)}</div>`);const routeHtml=routes.length?`<div class="customer-route-list">${routes.map(route=>`<div class="customer-route">${[route.week?'Week '+route.week:'',route.day||'',route.routeArea||route.layer||'',route.stop?'Stop '+route.stop:''].filter(Boolean).map(esc).join(' · ')}</div>`).join('')}</div>`:'';return `<section class="customer-section"><h3 class="customer-section-title">Water Maintenance</h3><div class="customer-summary">${lines.join('')}${routeHtml}</div></section>`;}
  function detail(label,value){return value?`<div class="customer-detail"><b>${esc(label)}</b><span>${esc(value)}</span></div>`:'';}
  function itemDetails(item){const d=item&&item.details&&typeof item.details==='object'?item.details:item||{};return [d.make||d.manufacturer,d.model,d.modelNumber,d.controller,d.purpose,d.connectedTo,d.quantity?('Qty '+d.quantity):'',d.notes].filter(Boolean).join(' · ');}
  function renderBodies(profile){const bodies=safeArray(profile.bodiesOfWater);if(!bodies.length)return '';return `<section class="customer-section"><h3 class="customer-section-title">Bodies of Water &amp; Equipment</h3><div class="customer-body-list">${bodies.map((body,index)=>{const name=body.name||body.type||('Body '+(index+1)),summary=[body.sanitization,body.filter&&body.filter.type,body.cover&&body.cover.winterType].filter(Boolean).join(' · ');const primary=[detail('Location',body.location),detail('Sanitization',body.sanitization),detail('Pump',[body.pump&&body.pump.make,body.pump&&body.pump.model,body.pump&&body.pump.modelNumber].filter(Boolean).join(' · ')),detail('Filter',[body.filter&&body.filter.make,body.filter&&body.filter.type,body.filter&&body.filter.model].filter(Boolean).join(' · ')),detail('Heater',[body.heater&&body.heater.type,body.heater&&body.heater.make,body.heater&&body.heater.model,body.heater&&body.heater.modelNumber].filter(Boolean).join(' · ')),detail('Cover',[body.cover&&body.cover.type,body.cover&&body.cover.winterType].filter(Boolean).join(' · '))].filter(Boolean).join('');let equipment=safeArray(body.equipment).map(item=>`<div class="customer-equipment-item"><b>${esc(humanType(item.type))}</b>${itemDetails(item)?' · '+esc(itemDetails(item)):''}</div>`).join('');const solar=safeArray(body.heater&&body.heater.solarEquipment).map(item=>`<div class="customer-equipment-item"><b>Solar · ${esc(humanType(item.type))}</b>${itemDetails(item)?' · '+esc(itemDetails(item)):''}</div>`).join('');const bodyNote=body.equipmentNotes?`<div class="customer-equipment-item"><b>Equipment Notes</b> · ${esc(body.equipmentNotes)}</div>`:'';return `<div class="customer-body-card"><button type="button" class="customer-body-toggle"><span><strong>${esc(name)}</strong>${summary?`<span style="display:block;margin-top:3px;color:var(--muted);font-weight:400">${esc(summary)}</span>`:''}</span><span>Details</span></button><div class="customer-body-details"><div class="customer-detail-grid">${primary}</div>${equipment||solar||bodyNote?`<div class="customer-equipment-list">${equipment}${solar}${bodyNote}</div>`:''}</div></div>`;}).join('')}</div></section>`;}
  function renderNotes(profile){const items=[];if(profile.entryInformation)items.push(['Entry Information',profile.entryInformation]);if(profile.equipmentNotes)items.push(['Equipment Notes',profile.equipmentNotes]);if(profile.generalNotes||profile.notes)items.push(['General Notes',profile.generalNotes||profile.notes]);if(profile.waterMaintenance&&profile.waterMaintenance.enabled&&profile.maintenanceNotes)items.push(['Maintenance Notes',profile.maintenanceNotes]);if(profile.openingNotes)items.push(['Opening Notes',profile.openingNotes]);if(profile.closingNotes)items.push(['Closing Notes',profile.closingNotes]);return items.length?`<section class="customer-section"><h3 class="customer-section-title">Notes</h3><div class="customer-notes-grid">${items.map(item=>`<div class="customer-note"><div class="customer-label">${esc(item[0])}</div><p>${esc(item[1])}</p></div>`).join('')}</div></section>`:'';}
  function statusClass(status){const s=String(status||'').toLowerCase();if(s.includes('not on'))return'off';if(s==='paused')return'paused';if(s==='inactive')return'inactive';return'';}
  function renderProfile(profile){$('customerProfileEmpty').hidden=true;$('customerProfile').hidden=false;const name=[profile.firstName,profile.lastName].filter(Boolean).join(' ')||profile.accountName||profile.displayName||profile.customerId;$('customerAvatar').textContent=initials(name);$('customerProfileName').textContent=name;$('customerProfileLocation').textContent=profile.locationName?(profile.isPrimaryServiceLocation?'Primary · ':'')+profile.locationName:'';$('customerProfileId').textContent=profile.customerId||'';const status=profile.maintenanceStatus||'Not on Water Maintenance';$('customerProfileStatus').textContent=status;$('customerProfileStatus').className='customer-status '+statusClass(status);const cards=[valueCard('Service Address',profile.address,profile.address?mapHref(profile.address):''),valueCard('Phone',profile.phone,profile.phone?telHref(profile.phone):''),valueCard('Email',profile.email,profile.email?mailHref(profile.email):'')].filter(Boolean).join('');$('customerProfileBody').innerHTML=`${renderLocations(profile)}${cards?`<div class="customer-contact-grid" style="margin-top:16px">${cards}</div>`:''}${renderContacts(profile)}${renderBilling(profile)}${renderMaintenance(profile)}${renderBodies(profile)}${renderNotes(profile)}<div id="customerInlineLocationHost"></div>`;document.querySelectorAll('.customer-location').forEach(button=>button.onclick=()=>selectCustomer(state.selectedSidebarId,button.dataset.locationId));document.querySelectorAll('.customer-body-toggle').forEach(button=>button.onclick=()=>button.closest('.customer-body-card').classList.toggle('open'));}
  function queueSearch(){clearTimeout(state.timer);state.timer=setTimeout(()=>loadCustomers($('customerSearch').value.trim()),150);}
  function editCurrent(){if(state.selectedLocationId&&typeof window.pmosOpenWebCustomerEditor==='function')window.pmosOpenWebCustomerEditor(state.selectedLocationId);}
  function addLocation(){if(!state.selectedLocationId)return;const button=$('customerAddLocation');button.disabled=true;button.textContent='Opening…';const options={inlineHostId:'customerInlineLocationHost',onClose:function(){button.disabled=false;button.textContent='Add Service Location';}};if(typeof window.pmosOpenWebServiceLocationEditor==='function')window.pmosOpenWebServiceLocationEditor(state.selectedLocationId,options);else{button.disabled=false;button.textContent='Add Service Location';document.dispatchEvent(new CustomEvent('pmos:add-service-location',{detail:{customerId:state.selectedLocationId,options:options}}));}}
  function openCustomerProfile(customerId){const id=String(customerId||'').trim();if(!id)return;state.selectedSidebarId=id;state.selectedLocationId=id;selectCustomer(id,id);if(!state.loaded&&state.listRequest===0)loadCustomers('');}
  function activate(){if(!state.loaded)loadCustomers('');setTimeout(()=>$('customerSearch').focus(),0);}
  $('customerEdit').onclick=editCurrent;$('customerAddLocation').onclick=addLocation;
  document.addEventListener('pmos:viewchange',event=>{if(event.detail&&event.detail.name==='customers')activate();});
  document.addEventListener('pmos:refresh',()=>{if(document.getElementById('view-customers').classList.contains('active')){const id=state.selectedLocationId;loadCustomers($('customerSearch').value.trim());if(id)setTimeout(()=>selectCustomer(state.selectedSidebarId||id,id),180);}});
  window.pmosOpenCustomerProfile=openCustomerProfile;
  document.addEventListener('DOMContentLoaded',()=>{$('customerSearch').addEventListener('input',queueSearch);});
})();
</script>
