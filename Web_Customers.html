<style>
.customer-layout{display:grid;grid-template-columns:minmax(245px,310px) minmax(0,1fr);gap:18px;align-items:start}.customer-browser{padding:0;overflow:hidden;position:sticky;top:0;max-height:calc(100vh - 145px);display:flex;flex-direction:column}.customer-browser-head{padding:18px 18px 13px;border-bottom:1px solid var(--border)}.customer-browser-head h2{margin:0;font-size:17px;font-weight:900}.customer-browser-head p{margin:4px 0 12px;color:var(--muted);font-size:12px}.customer-search{width:100%;min-height:41px;border:1px solid var(--border);border-radius:8px;background:#fff;padding:9px 11px;color:var(--text)}.customer-search:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px rgba(1,125,177,.16)}.customer-count{padding:9px 18px 7px;color:var(--muted);font-size:11px;font-weight:700}.customer-results{min-height:180px;overflow:auto;padding:0 8px 12px}.customer-result{display:block;width:100%;padding:10px 11px;border:0;border-left:3px solid transparent;border-radius:8px;background:transparent;color:var(--text);text-align:left;cursor:pointer}.customer-result:hover{background:var(--surface-soft)}.customer-result.active{border-left-color:var(--brand);background:#eaf4f8}.customer-result strong,.customer-result span{display:block}.customer-result strong{font-size:13px;font-weight:900}.customer-result span{margin-top:3px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.customer-profile-pane{min-width:0}.customer-profile-empty{min-height:360px;display:grid;place-items:center;text-align:center}.customer-profile-empty h2{margin:0 0 7px;font-size:22px}.customer-profile-empty p{max-width:430px;margin:0;color:var(--muted);line-height:1.55}.customer-profile{padding:0;overflow:hidden}.customer-profile[hidden]{display:none}.customer-profile-hero{display:flex;align-items:flex-start;gap:14px;padding:22px 24px;background:var(--surface-soft);border-bottom:1px solid var(--border)}.customer-avatar{width:54px;height:54px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:#dcecf3;color:var(--brand-dark);font-size:18px;font-weight:900}.customer-profile-identity{min-width:0}.customer-profile-identity h2{margin:0;font-size:25px;font-weight:900}.customer-profile-subline{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:5px;color:var(--muted);font-size:11px}.customer-status{padding:4px 8px;border-radius:999px;background:#dcecf3;color:var(--brand-dark);font-size:10px;font-weight:900;text-transform:uppercase}.customer-profile-body{padding:20px 24px 26px}.customer-contact-grid{display:grid;grid-template-columns:1.5fr .8fr 1.1fr;gap:10px}.customer-info-card{min-width:0;padding:13px 14px;border:1px solid var(--border);border-radius:9px;background:#fff}.customer-label{color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.customer-value{margin-top:5px;color:var(--text);font-size:12px;line-height:1.45;word-break:break-word}.customer-link{color:var(--brand-dark);text-decoration:none}.customer-link:hover{text-decoration:underline}.customer-section{margin-top:20px}.customer-section-title{margin:0 0 9px;font-size:16px;font-weight:900}.customer-summary{padding:13px 14px;border:1px solid var(--border);border-radius:9px;background:#fff}.customer-summary-line{font-size:12px;line-height:1.55}.customer-summary-line+.customer-summary-line{margin-top:5px}.customer-route-list{display:grid;gap:7px;margin-top:9px}.customer-route{padding:9px 11px;border-radius:8px;background:var(--surface-detail);font-size:11px;line-height:1.45}.customer-body-list{display:grid;gap:8px}.customer-body-card{border:1px solid var(--border);border-radius:9px;background:#fff;overflow:hidden}.customer-body-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 14px;border:0;background:#fff;color:var(--text);text-align:left;cursor:pointer}.customer-body-toggle:hover{background:var(--surface-soft)}.customer-body-toggle strong{font-size:12px;font-weight:900}.customer-body-toggle span{color:var(--brand-dark);font-size:10px;font-weight:900}.customer-body-details{display:none;padding:12px 14px 14px;border-top:1px solid var(--border);background:var(--surface-soft)}.customer-body-card.open .customer-body-details{display:block}.customer-detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.customer-detail{padding:9px;border-radius:7px;background:#fff}.customer-detail b,.customer-detail span{display:block}.customer-detail b{color:var(--muted);font-size:9px;text-transform:uppercase}.customer-detail span{margin-top:4px;font-size:11px}.customer-equipment-list{display:grid;gap:6px;margin-top:9px}.customer-equipment-item{padding:8px 9px;border-radius:7px;background:#fff;font-size:11px}.customer-account-contacts{display:grid;gap:7px}.customer-account-contact{display:grid;grid-template-columns:minmax(130px,.8fr) minmax(0,1fr) minmax(0,1.25fr);gap:10px;align-items:center;padding:10px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:11px}.customer-account-contact strong{font-weight:900}.customer-account-contact a{min-width:0;color:var(--brand-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}.customer-account-contact a:hover{text-decoration:underline}.customer-notes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.customer-note{padding:13px 14px;border:1px solid var(--border);border-radius:9px;background:#fff}.customer-note p{margin:6px 0 0;white-space:pre-wrap;font-size:12px;line-height:1.55}.customer-loading{padding:18px;color:var(--muted);text-align:center;font-size:12px}
@media(max-width:980px){.customer-layout{grid-template-columns:1fr}.customer-browser{position:static;max-height:330px}.customer-contact-grid,.customer-detail-grid{grid-template-columns:1fr}.customer-notes-grid{grid-template-columns:1fr}}
@media(max-width:620px){.customer-profile-hero,.customer-profile-body{padding-left:16px;padding-right:16px}.customer-account-contact{grid-template-columns:1fr}}
</style>

<section class="view" id="view-customers">
  <div class="customer-layout">
    <aside class="panel customer-browser">
      <div class="customer-browser-head">
        <h2>Customer Look-Up</h2>
        <p>Search by customer name, address, phone, email, or Customer ID.</p>
        <input id="customerSearch" class="customer-search" type="search" autocomplete="off" placeholder="Search customers">
      </div>
      <div id="customerCount" class="customer-count">Select Customer Look-Up to load customers.</div>
      <div id="customerResults" class="customer-results"></div>
    </aside>

    <div class="customer-profile-pane">
      <div id="customerProfileEmpty" class="panel customer-profile-empty">
        <div><h2>Find a customer</h2><p>Select a customer to open their PMOS profile.</p></div>
      </div>
      <article id="customerProfile" class="panel customer-profile" hidden>
        <div class="customer-profile-hero">
          <div id="customerAvatar" class="customer-avatar">—</div>
          <div class="customer-profile-identity">
            <h2 id="customerProfileName"></h2>
            <div class="customer-profile-subline"><span id="customerProfileId"></span><span id="customerProfileStatus" class="customer-status"></span></div>
          </div>
        </div>
        <div id="customerProfileBody" class="customer-profile-body"></div>
      </article>
    </div>
  </div>
</section>

<script>
(function(){
  'use strict';
  const customerState={loaded:false,rows:[],selectedId:'',timer:null,request:0};
  const $=id=>document.getElementById(id);
  function server(name,...args){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error&&error.message?error.message:String(error))));runner[name](...args);});}
  function esc(value){return String(value==null?'':value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
  function initials(name){return String(name||'').split(/\s+/).filter(Boolean).slice(0,2).map(part=>part.charAt(0).toUpperCase()).join('')||'—';}
  function mapHref(address){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(String(address||''));}
  function telHref(phone){return 'tel:'+String(phone||'').replace(/[^+\d]/g,'');}
  function mailHref(email){return 'mailto:'+encodeURIComponent(String(email||''));}
  function safeArray(value){return Array.isArray(value)?value:[];}
  function valueCard(label,value,href){if(!value)return '';const content=href?`<a class="customer-link" href="${esc(href)}" target="_blank" rel="noopener">${esc(value)}</a>`:esc(value);return `<div class="customer-info-card"><div class="customer-label">${esc(label)}</div><div class="customer-value">${content}</div></div>`;}
  async function loadCustomers(query){const request=++customerState.request;$('customerCount').textContent='Loading customers…';$('customerResults').innerHTML='<div class="customer-loading">Loading…</div>';try{const rows=await server('searchPmosCustomerProfiles',query||'');if(request!==customerState.request)return;customerState.loaded=true;customerState.rows=safeArray(rows);renderResults();}catch(error){if(request!==customerState.request)return;$('customerCount').textContent='Customer list unavailable';$('customerResults').innerHTML=`<div class="empty">${esc(error.message)}</div>`;}}
  function renderResults(){const rows=customerState.rows;$('customerCount').textContent=`${rows.length} customer${rows.length===1?'':'s'}`;$('customerResults').innerHTML=rows.length?rows.map(row=>`<button class="customer-result${row.customerId===customerState.selectedId?' active':''}" data-customer-id="${esc(row.customerId)}"><strong>${esc(row.listName||row.displayName||row.customerId)}</strong><span>${esc(row.address||row.phone||row.email||'')}</span></button>`).join(''):'<div class="empty">No matching customers.</div>';document.querySelectorAll('.customer-result').forEach(button=>button.onclick=()=>selectCustomer(button.dataset.customerId));}
  async function selectCustomer(customerId){customerState.selectedId=String(customerId||'');renderResults();$('customerProfileEmpty').hidden=false;$('customerProfileEmpty').innerHTML='<div class="customer-loading">Loading customer profile…</div>';$('customerProfile').hidden=true;try{const results=await Promise.all([server('getPmosCustomerProfile',customerState.selectedId),server('getPmosCustomerEditorHouseholdContacts',customerState.selectedId).catch(()=>[])]);if(customerState.selectedId!==customerId)return;renderProfile(results[0],results[1]);}catch(error){if(customerState.selectedId!==customerId)return;$('customerProfileEmpty').innerHTML=`<div><h2>Profile unavailable</h2><p>${esc(error.message)}</p></div>`;}}
  function renderMaintenance(profile){const routes=safeArray(profile.routes);const hasMaintenance=!!(profile.frequency||routes.length||profile.serviceStartDate||profile.yearRound);if(!hasMaintenance)return '';const lines=[];if(profile.frequency)lines.push(`<div class="customer-summary-line"><b>Frequency:</b> ${esc(profile.frequency)}</div>`);if(profile.serviceStartDate)lines.push(`<div class="customer-summary-line"><b>Service start:</b> ${esc(profile.serviceStartDate)}</div>`);if(profile.yearRound)lines.push(`<div class="customer-summary-line"><b>Season:</b> ${esc(String(profile.yearRound).toLowerCase()==='yes'?'Year Round':String(profile.yearRound).toLowerCase()==='no'?'Seasonal':profile.yearRound)}</div>`);const routeHtml=routes.length?`<div class="customer-route-list">${routes.map(route=>{const parts=[];if(route.week)parts.push('Week '+esc(route.week));if(route.day)parts.push(esc(route.day));if(route.routeArea)parts.push(esc(route.routeArea));if(route.stop)parts.push('Stop '+esc(route.stop));return `<div class="customer-route">${parts.join(' · ')||esc(route.layer||'Assigned route')}</div>`;}).join('')}</div>`:'';return `<section class="customer-section"><h3 class="customer-section-title">Maintenance</h3><div class="customer-summary">${lines.join('')}${routeHtml}</div></section>`;}
  function equipmentPairs(body){const pairs=[];const skip={equipment:1,robots:1,name:1,label:1,bodyName:1,type:1};Object.keys(body||{}).forEach(key=>{if(skip[key]||body[key]==null||body[key]===''||typeof body[key]==='object')return;pairs.push([key.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()),body[key]]);});return pairs;}
  function renderEquipmentItem(item){if(!item)return '';if(typeof item==='string')return `<div class="customer-equipment-item">${esc(item)}</div>`;const title=item.type||item.category||item.name||item.label||'Equipment';const detail=[item.make,item.manufacturer,item.model,item.modelNumber,item.controller].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(' · ');return `<div class="customer-equipment-item"><b>${esc(title)}</b>${detail?` — ${esc(detail)}`:''}</div>`;}
  function renderBodies(profile){const bodies=safeArray(profile.bodiesOfWater);if(!bodies.length&&!profile.equipmentSummary)return '';const cards=bodies.map((body,index)=>{const title=body.name||body.bodyName||body.label||body.type||`Body of Water ${index+1}`;const pairs=equipmentPairs(body);const equipment=safeArray(body.equipment).concat(safeArray(body.robots));return `<div class="customer-body-card"><button type="button" class="customer-body-toggle"><strong>${esc(title)}</strong><span>Details</span></button><div class="customer-body-details">${pairs.length?`<div class="customer-detail-grid">${pairs.map(pair=>`<div class="customer-detail"><b>${esc(pair[0])}</b><span>${esc(pair[1])}</span></div>`).join('')}</div>`:''}${equipment.length?`<div class="customer-equipment-list">${equipment.map(renderEquipmentItem).join('')}</div>`:''}${!pairs.length&&!equipment.length?'<div class="muted">No additional details recorded.</div>':''}</div></div>`;}).join('');const summary=profile.equipmentSummary?`<div class="customer-summary" style="margin-bottom:8px"><div class="customer-summary-line">${esc(profile.equipmentSummary)}</div></div>`:'';return `<section class="customer-section"><h3 class="customer-section-title">Bodies of Water &amp; Equipment</h3>${summary}<div class="customer-body-list">${cards}</div></section>`;}
  function renderContacts(contacts){contacts=safeArray(contacts);if(!contacts.length)return '';return `<section class="customer-section"><h3 class="customer-section-title">Account Contacts</h3><div class="customer-account-contacts">${contacts.map(contact=>{const name=[contact.firstName,contact.lastName].filter(Boolean).join(' ')||'Contact';const phone=contact.phone?`<a href="${esc(telHref(contact.phone))}">${esc(contact.phone)}</a>`:'<span class="muted">No phone</span>';const email=contact.email?`<a href="${esc(mailHref(contact.email))}">${esc(contact.email)}</a>`:'<span class="muted">No email</span>';return `<div class="customer-account-contact"><strong>${esc(name)}</strong>${phone}${email}</div>`;}).join('')}</div></section>`;}
  function renderNotes(profile){const items=[];if(profile.entryInformation)items.push(`<div class="customer-note"><div class="customer-label">Entry Information</div><p>${esc(profile.entryInformation)}</p></div>`);if(profile.notes)items.push(`<div class="customer-note"><div class="customer-label">Customer Notes</div><p>${esc(profile.notes)}</p></div>`);return items.length?`<section class="customer-section"><h3 class="customer-section-title">Notes</h3><div class="customer-notes-grid">${items.join('')}</div></section>`:'';}
  function renderProfile(profile,contacts){$('customerProfileEmpty').hidden=true;$('customerProfile').hidden=false;$('customerAvatar').textContent=initials(profile.displayName);$('customerProfileName').textContent=profile.displayName||profile.customerId;$('customerProfileId').textContent=profile.customerId||'';$('customerProfileStatus').textContent=profile.status||'Active';const contactsHtml=[valueCard('Service Address',profile.address,profile.address?mapHref(profile.address):''),valueCard('Phone',profile.phone,profile.phone?telHref(profile.phone):''),valueCard('Email',profile.email,profile.email?mailHref(profile.email):'')].filter(Boolean).join('');$('customerProfileBody').innerHTML=`${contactsHtml?`<div class="customer-contact-grid">${contactsHtml}</div>`:''}${renderContacts(contacts)}${renderMaintenance(profile)}${renderBodies(profile)}${renderNotes(profile)}`;document.querySelectorAll('.customer-body-toggle').forEach(button=>button.onclick=()=>button.closest('.customer-body-card').classList.toggle('open'));}
  function queueSearch(){clearTimeout(customerState.timer);customerState.timer=setTimeout(()=>loadCustomers($('customerSearch').value.trim()),180);}
  function activate(){if(!customerState.loaded)loadCustomers('');setTimeout(()=>$('customerSearch').focus(),0);}
  document.addEventListener('pmos:viewchange',event=>{if(event.detail&&event.detail.name==='customers')activate();});
  document.addEventListener('pmos:refresh',()=>{if(document.getElementById('view-customers').classList.contains('active'))loadCustomers($('customerSearch').value.trim());});
  document.addEventListener('DOMContentLoaded',()=>{$('customerSearch').addEventListener('input',queueSearch);});
})();
</script>
