const wm=profile.waterMaintenance||{};if(!wm.enabled)return summaryCard('Water Maintenance','Not enrolled','<div class="customer-details-grid">'+detail('Service state','Not enrolled')+'</div>');const routeDetails=safeArray(profile.routes).map(route=>[route.day,route.week?'Week '+route.week:'',route.routeArea||route.layer,route.stop?'Stop '+route.stop:''].filter(Boolean).join(' · ')).join('\n'),season=wm.yearRound||profile.yearRound||'Seasonal';return summaryCard(season,maintenanceSummary(profile),'<div class="customer-details-grid">'+detail('Maintenance status',wm.status||'Active')+detail('Visit frequency',wm.frequency||profile.frequency)+detail('Service start',wm.serviceStartDate||profile.serviceStartDate)+detail('Route assignment',routeDetails)+'</div>');}function renderBilling(profile){const b=profile.accountBillingAddress||{};if(!b.enabled)return'';const address=[[b.addressLine1,b.addressLine2].filter(Boolean).join(', '),b.city,b.province,b.postalCode,b.country].filter(Boolean).join(', ');return'<div class="customer-section-head"><h3>Account Billing Address</h3></div>'+valueCard('Billing address',address);}function renderNotes(profile){const items=[];if(profile.entryInformation)items.push(['Entry Information',profile.entryInformation]);if(profile.generalNotes||profile.notes)items.push(['General Notes',profile.generalNotes||profile.notes]);if(profile.waterMaintenance&&profile.waterMaintenance.enabled&&profile.maintenanceNotes)items.push(['Maintenance Notes',profile.maintenanceNotes]);if(profile.openingNotes)items.push(['Opening Notes',profile.openingNotes]);if(profile.closingNotes)items.push(['Closing Notes',profile.closingNotes]);if(!items.length)return'';return'<div class="customer-section-head"><h3>Customer Details</h3></div><div class="customer-notes'+(items.length===1?' single':'')+'">'+items.map(item=>'<div class="customer-note"><div class="customer-label">'+esc(item[0])+'</div><p>'+esc(item[1])+'</p></div>').join('')+'</div>';}async function loadCustomers(query){const request=++state.listRequest;$('customerCount').textContent='Loading customers…';$('customerResults').innerHTML='<div class="customer-loading">Loading…</div>';try{const rows=await server('searchPmosCustomerAccountProfiles',query||'');if(request!==state.listRequest)return;state.loaded=true;state.rows=safeArray(rows);renderResults();}catch(error){if(request!==state.listRequest)return;$('customerCount').textContent='Customer list unavailable';$('customerResults').innerHTML='<div class="customer-loading">'+esc(error.message)+'</div>';}}function renderResults(){const rows=state.rows;$('customerCount').textContent=rows.length+' customer account'+(rows.length===1?'':'s');$('customerResults').innerHTML=rows.length?rows.map(row=>{const meta=[row.address,row.sidebarMeta].filter(Boolean).join(' · ');return'<button type="button" class="customer-result'+(row.customerId===state.selectedSidebarId?' active':'')+'" data-customer-id="'+esc(row.customerId)+'"><div class="customer-result-name">'+esc(row.listName||row.displayName||row.customerId)+'</div><div class="customer-result-meta">'+esc(meta||row.phone||row.email||'')+'</div></button>';}).join(''):'<div class="customer-loading">No matching customers.</div>';$('customerResults').querySelectorAll('.customer-result').forEach(button=>button.onclick=()=>selectCustomer(button.dataset.customerId,button.dataset.customerId));}async function selectCustomer(sidebarId,locationId){const request=++state.profileRequest;state.selectedSidebarId=String(sidebarId||'');state.selectedLocationId=String(locationId||sidebarId||'');renderResults();clearError();$('customerEmpty').style.display='none';$('customerProfile').style.display='none';try{const profile=await server('getPmosWebCustomerProfile',state.selectedLocationId);if(request!==state.profileRequest)return;state.profile=profile;renderProfile(profile);}catch(error){if(request!==state.profileRequest)return;$('customerEmpty').style.display='grid';$('customerEmpty').innerHTML='<div><h2>Profile unavailable</h2><p>'+esc(error.message)+'</p></div>';}}function statusClass(status){const s=String(status||'').toLowerCase();if(s.includes('not on')||s.includes('not enrolled'))return'off';if(s==='paused')return'paused';if(s==='inactive')return'inactive';return'';}function renderProfile(profile){$('customerEmpty').style.display='none';$('customerProfile').style.display='block';const name=[profile.firstName,profile.lastName].filter(Boolean).join(' ')||profile.accountName||profile.displayName||profile.customerId;$('customerAvatar').textContent=initials(name);$('customerProfileName').textContent=name;$('customerProfileSubtitle').textContent=(profile.locationName?(profile.isPrimaryServiceLocation?'Primary · ':'')+profile.locationName:'')+(profile.customerId?' · '+profile.customerId:'');const status=profile.maintenanceStatus||(profile.waterMaintenance&&profile.waterMaintenance.enabled?(profile.waterMaintenance.status||'Active'):'Not on Water Maintenance');$('customerProfileStatus').textContent=status;$('customerProfileStatus').className='customer-badge '+statusClass(status);const contacts='<div class="customer-contact-grid">'+valueCard('Service Address',profile.address,profile.address?mapHref(profile.address):'','map')+valueCard('Phone',profile.phone,profile.phone?telHref(profile.phone):'')+valueCard('Email',profile.email,profile.email?mailHref(profile.email):'')+'</div>',bodies=safeArray(profile.bodiesOfWater).map(bodyHtml).join('')||(profile.equipmentSummary?valueCard('Equipment',profile.equipmentSummary):'');$('customerContent').innerHTML=renderLocations(profile)+contacts+renderContacts(profile)+renderBilling(profile)+'<div class="customer-section-head"><h3>Maintenance</h3></div>'+renderMaintenance(profile)+'<div class="customer-section-head"><h3>Bodies of Water &amp; Equipment</h3></div>'+(bodies||'<div class="customer-card"><div class="customer-value">No equipment information recorded.</div></div>')+renderNotes(profile)+'<div id="customerInlineLocationHost"></div>';$('customerContent').querySelectorAll('.customer-location-card').forEach(button=>button.onclick=()=>selectCustomer(state.selectedSidebarId,button.dataset.locationId));$('customerContent').querySelectorAll('.customer-summary-head').forEach(button=>button.onclick=()=>{const card=button.closest('.customer-summary-card'),open=card.classList.toggle('open'),label=button.querySelector('.customer-toggle-label');if(label)label.textContent=open?'Hide details':'View details';});if(window.pmosRefreshEquipmentDisplayLabels)window.pmosRefreshEquipmentDisplayLabels($('customerProfile'));}function queueSearch(){clearTimeout(state.timer);state.timer=setTimeout(()=>loadCustomers($('customerSearch').value.trim()),150);}function editCurrent(){const id=state.selectedLocationId;if(!id)return;if(typeof window.pmosOpenWebCustomerEditor==='function'){window.pmosOpenWebCustomerEditor(id);return;}document.dispatchEvent(new CustomEvent('pmos:edit-customer',{detail:{customerId:id}}));}function addLocation(){const id=state.selectedLocationId;if(!id)return;const button=$('customerAddLocation'),options={inlineHostId:'customerInlineLocationHost',onClose:()=>{button.disabled=false;button.textContent='+ Add Service Location';}};button.disabled=true;button.textContent='Opening…';if(typeof window.pmosOpenWebServiceLocationEditor==='function')window.pmosOpenWebServiceLocationEditor(id,options);else{button.disabled=false;button.textContent='+ Add Service Location';document.dispatchEvent(new CustomEvent('pmos:add-service-location',{detail:{customerId:id,options}}));}}function openCustomerProfile(customerId){const id=String(customerId||'').trim();if(!id)return;state.selectedSidebarId=id;state.selectedLocationId=id;selectCustomer(id,id);if(!state.loaded&&state.listRequest===0)loadCustomers('');}function activate(){if(!state.loaded)loadCustomers('');setTimeout(()=>$('customerSearch').focus(),0);}function toggleSidebar(){const collapsed=$('customerApp').classList.toggle('sidebar-collapsed');$('customerCollapse').title=collapsed?'Show customer list':'Hide customer list';$('customerCollapse').setAttribute('aria-label',$('customerCollapse').title);if(!collapsed)setTimeout(()=>$('customerSearch').focus(),240);}$('customerEdit').onclick=editCurrent;$('customerAddLocation').onclick=addLocation;$('customerCollapse').onclick=toggleSidebar;$('customerSearch').addEventListener('input',queueSearch);$('customerSearch').addEventListener('keydown',event=>{if(event.key==='Enter'){const first=$('customerResults').querySelector('.customer-result');if(first){event.preventDefault();first.click();}}});document.addEventListener('pmos:viewchange',event=>{if(event.detail&&event.detail.name==='customers')activate();});document.addEventListener('pmos:refresh',()=>{if(document.getElementById('view-customers').classList.contains('active')){const id=state.selectedLocationId;loadCustomers($('customerSearch').value.trim());if(id)setTimeout(()=>selectCustomer(state.selectedSidebarId||id,id),180);}});window.pmosOpenCustomerProfile=openCustomerProfile;})();
</script>
