<style>
.tm-layout{display:grid;gap:16px}.tm-panel{max-width:1040px}.tm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tm-full{grid-column:1/-1}.tm-section-title{grid-column:1/-1;margin-top:4px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;font-weight:900;color:var(--text)}.tm-grid label{display:grid;gap:6px;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.tm-grid input,.tm-grid textarea{width:100%;min-height:40px;border:1px solid var(--border);border-radius:8px;background:#fff;padding:8px 10px;color:var(--text);font:inherit}.tm-grid textarea{min-height:78px;resize:vertical}.tm-grid input:focus,.tm-grid textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px rgba(1,125,177,.16)}.tm-address-wrap{position:relative}.tm-address-list{display:none;position:absolute;z-index:60;top:calc(100% + 2px);left:0;right:0;max-height:250px;overflow:auto;border:1px solid #aebdc5;border-radius:8px;background:#fff;box-shadow:0 12px 28px rgba(41,57,68,.18)}.tm-address-option{display:block;width:100%;padding:10px 12px;border:0;border-bottom:1px solid var(--border);background:#fff;color:var(--text);text-align:left;cursor:pointer}.tm-address-option:hover,.tm-address-option.active{background:#eef7fb}.tm-confirmed{display:none;padding:11px 13px;border:1px solid #b9dbc6;border-left:4px solid #63b989;border-radius:9px;background:#edf7f1;color:#286344;font-size:12px;line-height:1.45}.tm-route-status,.tm-status{padding:11px 13px;border:1px solid #bddae0;border-left:4px solid var(--brand);border-radius:9px;background:#eef6f8;color:var(--brand-dark);font-size:12px;line-height:1.5;white-space:pre-wrap}.tm-route-status.working,.tm-status.working{border-color:#ddc88f;border-left-color:#c89b4c;background:#faf5e7;color:#765b21}.tm-route-status.error,.tm-status.error{border-color:#e3bcbc;border-left-color:#d76b6b;background:#f9eeee;color:#873232}.tm-status.success{border-color:#b9dbc6;border-left-color:#63b989;background:#edf7f1;color:#286344}.tm-date-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tm-date-option{display:grid;gap:6px;padding:13px;border:1px solid var(--border);border-left:4px solid var(--focus);border-radius:9px;background:#fff;color:var(--text);text-align:left;cursor:pointer}.tm-date-option:hover{background:#f3f8fa}.tm-date-option.selected{border-color:var(--brand);border-left-color:var(--brand);background:#e7f3f8}.tm-date-title{font-size:12px;font-weight:900}.tm-date-meta{font-size:11px;color:var(--muted);line-height:1.45}.tm-visits{display:grid;gap:10px}.tm-visit{padding:12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-soft)}.tm-visit-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.tm-visit-head strong{font-size:12px}.tm-visit-grid{display:grid;grid-template-columns:minmax(160px,.7fr) 100px minmax(190px,1fr);gap:10px}.tm-visit-recommendation{margin-top:9px;padding:9px;border-radius:8px;background:#eef3f5;color:var(--muted);font-size:11px;line-height:1.45;white-space:pre-wrap}.tm-visit-recommendation.good{background:#edf7f1;color:#286344}.tm-visit-recommendation.fair{background:#faf5e7;color:#765b21}.tm-visit-recommendation.poor{background:#f9eeee;color:#873232}.tm-actions{display:flex;gap:9px;align-items:center;max-width:1040px}.tm-actions .tm-spacer{flex:1}.tm-hidden{display:none!important}@media(max-width:820px){.tm-grid,.tm-date-grid,.tm-visit-grid{grid-template-columns:1fr}.tm-full,.tm-section-title{grid-column:1}.tm-actions{flex-wrap:wrap}.tm-actions .tm-spacer{display:none}}
</style>

<section class="view" id="view-tempmaintenance">
  <div class="tm-layout">
    <article class="panel tm-panel">
      <div class="panel-heading">
        <div>
          <h2>Temporary Maintenance</h2>
          <p>Schedule one or more non-recurring maintenance visits and place them into the best existing routes.</p>
        </div>
      </div>

      <div class="tm-grid">
        <div class="tm-section-title">Service Location</div>
        <label class="tm-full">Service address
          <div class="tm-address-wrap">
            <input id="tmAddress" autocomplete="off" placeholder="Begin typing address">
            <div id="tmAddressList" class="tm-address-list"></div>
          </div>
        </label>
        <div id="tmConfirmedAddress" class="tm-confirmed tm-full"></div>
        <div id="tmRouteStatus" class="tm-route-status tm-full">Select a complete address to calculate the best upcoming route dates.</div>

        <div class="tm-section-title">Customer Information</div>
        <label>Last name<input id="tmLastName" autocomplete="family-name"></label>
        <label>First name<input id="tmFirstName" autocomplete="given-name"></label>
        <label>Phone<input id="tmPhone" autocomplete="tel" inputmode="tel"></label>
        <label>Email<input id="tmEmail" type="email" autocomplete="email"></label>

        <div class="tm-section-title">Recommended Dates</div>
        <div id="tmDateRecommendations" class="tm-date-grid tm-full"></div>
        <div class="tm-full"><button id="tmRefreshDates" type="button" class="button secondary">Refresh Recommendations</button></div>

        <div class="tm-section-title">Visit Placement</div>
        <div id="tmVisits" class="tm-visits tm-full"></div>
        <div class="tm-full"><button id="tmAddVisit" type="button" class="button secondary">+ Add Another Visit</button></div>

        <div class="tm-section-title">Visit Information</div>
        <label class="tm-full">Entry Information<textarea id="tmEntryInformation" placeholder="Gate code, access details, special instructions..."></textarea></label>
        <label class="tm-full">Customer / Service Notes<textarea id="tmNotes" placeholder="Customer preferences or service notes..."></textarea></label>

        <div id="tmStatus" class="tm-status tm-full">Ready.</div>
      </div>
    </article>

    <div class="tm-actions">
      <button id="tmCreateAnother" type="button" class="button secondary tm-hidden">Schedule Another</button>
      <span class="tm-spacer"></span>
      <button id="tmSchedule" type="button" class="button primary">Schedule Visit(s)</button>
    </div>
  </div>
</section>

<script>
(function(){
  'use strict';
  const state={initialized:false,selectedAddress:null,addressTimer:null,addressRequest:0,addressItems:[],activeAddress:-1,dateRequest:0,recommendations:[],visitCounter:0,completed:false};
  const $=id=>document.getElementById(id);
  const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function call(name,...args){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error&&error.message?error.message:String(error))));runner[name](...args);});}
  function setStatus(text,mode){const el=$('tmStatus');el.textContent=text;el.classList.remove('working','error','success');if(mode)el.classList.add(mode);}
  function setRouteStatus(text,mode){const el=$('tmRouteStatus');el.textContent=text;el.classList.remove('working','error');if(mode)el.classList.add(mode);}
  function formatName(input){input.value=String(input.value||'').replace(/(^|[\s'-])([a-z])/g,(m,p,l)=>p+l.toUpperCase());}
  function formatPhone(){const input=$('tmPhone'),digits=String(input.value||'').replace(/\D/g,'').slice(0,10);let value='';if(digits.length)value='('+digits.slice(0,3);if(digits.length>=3)value+=') '+digits.slice(3,6);if(digits.length>=6)value+=' - '+digits.slice(6,10);input.value=value;}
  function hideAddresses(){const list=$('tmAddressList');list.style.display='none';list.innerHTML='';state.addressItems=[];state.activeAddress=-1;}
  function clearAddress(){state.selectedAddress=null;$('tmConfirmedAddress').style.display='none';$('tmConfirmedAddress').innerHTML='';state.recommendations=[];$('tmDateRecommendations').innerHTML='';}
  function renderAddresses(items){const list=$('tmAddressList');state.addressItems=items||[];state.activeAddress=-1;list.innerHTML='';if(!state.addressItems.length){hideAddresses();setRouteStatus('No complete address matches yet. Continue typing.');return;}state.addressItems.forEach((item,index)=>{const button=document.createElement('button');button.type='button';button.className='tm-address-option';button.textContent=item.address||'';button.onmousedown=event=>{event.preventDefault();confirmAddress(index);};list.appendChild(button);});list.style.display='block';setRouteStatus('Choose the correct complete service address.');}
  function setActiveAddress(index){const options=Array.from($('tmAddressList').querySelectorAll('.tm-address-option'));if(!options.length)return;state.activeAddress=(index+options.length)%options.length;options.forEach((button,i)=>button.classList.toggle('active',i===state.activeAddress));options[state.activeAddress].scrollIntoView({block:'nearest'});}
  async function confirmAddress(index){const item=state.addressItems[index];if(!item)return;hideAddresses();setRouteStatus('Confirming address…','working');try{const resolved=await call('confirmPmosSelectedAddress',item);state.selectedAddress=resolved;$('tmAddress').value=resolved.address||'';const box=$('tmConfirmedAddress');box.innerHTML='<b>Confirmed address</b><br>'+esc(resolved.address||'');box.style.display='block';setRouteStatus('Address confirmed. Comparing upcoming weekday routes…','working');loadDateRecommendations();$('tmLastName').focus();}catch(error){clearAddress();setRouteStatus(error.message,'error');}}
  function queueAddress(){clearTimeout(state.addressTimer);const q=$('tmAddress').value.trim(),request=++state.addressRequest;if(state.selectedAddress&&q.toLowerCase()!==String(state.selectedAddress.address||'').toLowerCase())clearAddress();if(q.length<3){hideAddresses();setRouteStatus(q?'Type at least 3 address characters to see suggestions.':'Select a complete address to calculate the best upcoming route dates.');return;}setRouteStatus('Loading address suggestions…','working');state.addressTimer=setTimeout(async()=>{try{const items=await call('suggestPmosAddresses',q,6);if(request!==state.addressRequest)return;renderAddresses(items||[]);}catch(error){if(request!==state.addressRequest)return;hideAddresses();setRouteStatus(error.message,'error');}},160);}
  function addressKeydown(event){if(event.key==='ArrowDown'&&state.addressItems.length){event.preventDefault();setActiveAddress(state.activeAddress+1);}else if(event.key==='ArrowUp'&&state.addressItems.length){event.preventDefault();setActiveAddress(state.activeAddress-1);}else if(event.key==='Enter'){event.preventDefault();if(state.addressItems.length)confirmAddress(state.activeAddress<0?0:state.activeAddress);else if(state.selectedAddress)$('tmLastName').focus();}else if(event.key==='Escape')hideAddresses();}
  async function loadDateRecommendations(){if(!state.selectedAddress)return;const request=++state.dateRequest;setRouteStatus('Comparing the next six weekday routes…','working');$('tmDateRecommendations').innerHTML='<div class="tm-route-status tm-full">Calculating route recommendations…</div>';try{const result=await call('recommendTemporaryVisitDates',{address:$('tmAddress').value.trim(),addressVerified:true,addressDetails:state.selectedAddress,startOffsetWorkingDays:0,workdayCount:6,maxResults:3});if(request!==state.dateRequest)return;state.recommendations=(result&&result.recommendations)||[];renderDateRecommendations();setRouteStatus(state.recommendations.length?'Best upcoming route dates are ready below.':'No weekday route recommendations were available.');}catch(error){if(request!==state.dateRequest)return;state.recommendations=[];$('tmDateRecommendations').innerHTML='';setRouteStatus(error.message,'error');}}
  function renderDateRecommendations(){const box=$('tmDateRecommendations');box.innerHTML='';state.recommendations.forEach((r,index)=>{const button=document.createElement('button');button.type='button';button.className='tm-date-option pmos-route-rec';if(typeof pmosRouteRecommendationHtml==='function')button.innerHTML=pmosRouteRecommendationHtml(r,index,{dateLabel:r.displayDate||r.date||'',includeTemplate:false});else{const added=r.roadDataComplete?('Added: +'+Math.round(Number(r.addedDurationMinutes||0))+' min · +'+Number(r.addedDistanceKm||0).toFixed(1)+' km'):(r.reason||'Road estimate unavailable');button.innerHTML='<div class="tm-date-title">'+esc(r.displayDate||r.date||('Option '+(index+1)))+'</div><div class="tm-date-meta">'+esc(added)+'</div>';}button.onclick=()=>{box.querySelectorAll('.tm-date-option').forEach(el=>el.classList.remove('selected'));button.classList.add('selected');applyRecommendedDate(r);};box.appendChild(button);});}
  function visitCards(){return Array.from($('tmVisits').querySelectorAll('.tm-visit'));}
  function addVisit(defaults){state.visitCounter++;const card=document.createElement('div');card.className='tm-visit';card.innerHTML='<div class="tm-visit-head"><strong>Visit</strong><button type="button" class="button secondary tm-remove-visit">Remove</button></div><div class="tm-visit-grid"><label>Date<input class="tm-visit-date" type="date"></label><label>Stop<input class="tm-visit-stop" type="number" min="1" value="1"></label><label>Calendar title<input class="tm-visit-title" placeholder="Defaults to last name"></label></div><div class="tm-visit-recommendation">Choose a date to calculate GPS route placement.</div>';$('tmVisits').appendChild(card);card.querySelector('.tm-visit-date').value=defaults&&defaults.date||'';card.querySelector('.tm-visit-stop').value=defaults&&defaults.stopPosition||1;card.querySelector('.tm-visit-title').value=defaults&&defaults.calendarTitle||$('tmLastName').value.trim();card.querySelector('.tm-remove-visit').onclick=()=>{card.remove();renumberVisits();};card.querySelector('.tm-visit-date').onchange=()=>{card.dataset.manual='false';refreshPlacement(card);};card.querySelector('.tm-visit-stop').oninput=()=>{card.dataset.manual='true';};renumberVisits();if(card.querySelector('.tm-visit-date').value)refreshPlacement(card);return card;}
  function renumberVisits(){const cards=visitCards();cards.forEach((card,index)=>{card.querySelector('.tm-visit-head strong').textContent='Visit #'+(index+1);card.querySelector('.tm-remove-visit').classList.toggle('tm-hidden',cards.length===1);});}
  function applyRecommendedDate(rec){let card=visitCards().find(item=>!item.querySelector('.tm-visit-date').value);if(!card)card=addVisit();card.dataset.manual='false';card.querySelector('.tm-visit-date').value=rec.date||'';card.querySelector('.tm-visit-stop').value=rec.position||1;renderPlacement(card,rec);}
  async function refreshPlacement(card){if(!state.selectedAddress)return;const date=card.querySelector('.tm-visit-date').value;if(!date)return;const box=card.querySelector('.tm-visit-recommendation');box.className='tm-visit-recommendation';box.textContent='Calculating GPS route placement…';try{const result=await call('suggestTemporaryVisitPlacement',{address:$('tmAddress').value.trim(),addressVerified:true,addressDetails:state.selectedAddress,dates:[date],date:date});if(card.dataset.manual!=='true')card.querySelector('.tm-visit-stop').value=result.position||1;renderPlacement(card,result);}catch(error){box.className='tm-visit-recommendation poor';box.textContent=error.message;}}
  function renderPlacement(card,result){const box=card.querySelector('.tm-visit-recommendation'),lines=[(result.dayName||'Route')+' · Stop '+(result.position||1)+' of '+(Number(result.customerCount||0)+1)];if(result.previousName||result.nextName)lines.push('Between: '+(result.previousName||'Route start')+' and '+(result.nextName||'Route end'));if(result.roadDataComplete)lines.push('Added: +'+Math.round(Number(result.addedDurationMinutes||0))+' min · +'+Number(result.addedDistanceKm||0).toFixed(1)+' km');if(result.reason)lines.push(result.reason);box.textContent=lines.join('\n');box.className='tm-visit-recommendation '+(result.ratingClass||'good');}
  function updateTitles(){const last=$('tmLastName').value.trim();visitCards().forEach(card=>{const input=card.querySelector('.tm-visit-title');if(!input.dataset.edited)input.value=last;});}
  function collectPayload(){const rows=visitCards().map(card=>({date:card.querySelector('.tm-visit-date').value,stopPosition:Math.max(1,Number(card.querySelector('.tm-visit-stop').value||1)),calendarTitle:card.querySelector('.tm-visit-title').value.trim()})).filter(row=>row.date);const firstTitle=rows[0]&&rows[0].calendarTitle||$('tmLastName').value.trim();return{title:firstTitle,calendarTitle:firstTitle,firstName:$('tmFirstName').value.trim(),lastName:$('tmLastName').value.trim(),fullName:[$('tmFirstName').value.trim(),$('tmLastName').value.trim()].filter(Boolean).join(' '),address:$('tmAddress').value.trim(),addressVerified:!!state.selectedAddress,addressDetails:state.selectedAddress,phone:$('tmPhone').value.trim(),email:$('tmEmail').value.trim(),entryInformation:$('tmEntryInformation').value.trim(),customerNotes:$('tmNotes').value.trim(),visits:rows.map(row=>({date:row.date,stopPosition:row.stopPosition})),dates:rows.map(row=>row.date),stopPositions:rows.map(row=>row.stopPosition)};}
  async function schedule(){if(state.completed)return;const data=collectPayload();if(!data.addressVerified){setStatus('Choose and confirm a complete service address.','error');return;}if(!data.title){setStatus('Enter a surname or Calendar title.','error');return;}if(!data.visits.length){setStatus('Choose at least one visit date.','error');return;}$('tmSchedule').disabled=true;$('tmSchedule').textContent='Scheduling…';setStatus('Creating temporary maintenance visit(s) and restaggering the selected route(s)…','working');try{const result=await call('scheduleTemporaryVisitsV2',data);state.completed=true;$('tmSchedule').textContent='Complete';$('tmCreateAnother').classList.remove('tm-hidden');const details=Array.isArray(result&&result.details)?result.details:[];setStatus((result.created||0)+' temporary maintenance visit(s) created.\n'+(result.adjusted||0)+' event time(s) adjusted.'+(details.length?'\n\n'+details.join('\n'):''),'success');document.dispatchEvent(new CustomEvent('pmos:refresh'));}catch(error){$('tmSchedule').disabled=false;$('tmSchedule').textContent='Schedule Visit(s)';setStatus(error.message,'error');}}
  function reset(){state.selectedAddress=null;state.recommendations=[];state.completed=false;state.visitCounter=0;['tmAddress','tmLastName','tmFirstName','tmPhone','tmEmail','tmEntryInformation','tmNotes'].forEach(id=>$(id).value='');$('tmConfirmedAddress').style.display='none';$('tmDateRecommendations').innerHTML='';$('tmVisits').innerHTML='';$('tmSchedule').disabled=false;$('tmSchedule').textContent='Schedule Visit(s)';$('tmCreateAnother').classList.add('tm-hidden');setRouteStatus('Select a complete address to calculate the best upcoming route dates.');setStatus('Ready.');addVisit();$('tmAddress').focus();}
  function enterMove(event){if(event.key!=='Enter')return;const order=['tmLastName','tmFirstName','tmPhone','tmEmail'],index=order.indexOf(event.target.id);if(index<0)return;event.preventDefault();const next=$(order[index+1]);if(next)next.focus();else{const date=$('tmVisits').querySelector('.tm-visit-date');if(date)date.focus();}}
  function init(){if(state.initialized)return;state.initialized=true;$('tmAddress').addEventListener('input',queueAddress);$('tmAddress').addEventListener('focus',queueAddress);$('tmAddress').addEventListener('keydown',addressKeydown);$('tmAddress').addEventListener('blur',()=>setTimeout(hideAddresses,180));$('tmLastName').addEventListener('input',()=>{formatName($('tmLastName'));updateTitles();});$('tmFirstName').addEventListener('input',()=>formatName($('tmFirstName')));$('tmPhone').addEventListener('input',formatPhone);['tmLastName','tmFirstName','tmPhone','tmEmail'].forEach(id=>$(id).addEventListener('keydown',enterMove));$('tmVisits').addEventListener('input',event=>{if(event.target.classList.contains('tm-visit-title'))event.target.dataset.edited='true';});$('tmRefreshDates').addEventListener('click',loadDateRecommendations);$('tmAddVisit').addEventListener('click',()=>addVisit());$('tmSchedule').addEventListener('click',schedule);$('tmCreateAnother').addEventListener('click',reset);addVisit();call('preparePmosAddressSuggestions').catch(()=>{});}
  document.addEventListener('pmos:viewchange',event=>{if(event.detail&&event.detail.name==='tempmaintenance'){init();setTimeout(()=>{if(!state.completed&&!$('tmAddress').value)$('tmAddress').focus();},0);}});
})();
</script>
