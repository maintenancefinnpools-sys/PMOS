<style>
.nav-section{padding:14px 10px 4px;color:#cbd6db;font-size:9px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.nav-section:first-child{padding-top:4px}.nav-menu-label{display:flex;align-items:center;gap:9px;min-height:36px;padding:8px 10px;color:#f4f7f8;font-size:12px;font-weight:900}.nav-menu-label .nav-icon{color:#cfe8f2}.nav-item,.nav-item.nav-subitem{min-height:36px;height:36px;margin-left:0;width:100%;padding:8px 10px;font-size:12px}.nav-item.nav-subitem{background:rgba(255,255,255,.055)}.nav-item.nav-subitem:hover{background:rgba(255,255,255,.13)}.nav-item.nav-subitem.active{background:rgba(1,125,177,.34)}
.app-shell.sidebar-collapsed{grid-template-columns:46px minmax(0,1fr)}.app-shell.sidebar-collapsed>.sidebar{width:46px;overflow:visible;z-index:40}.app-shell.sidebar-collapsed>.sidebar .brand{height:62px;min-width:46px;padding:0;opacity:0;pointer-events:none}.app-shell.sidebar-collapsed>.sidebar .sidebar-inner{min-width:46px;opacity:1;pointer-events:auto;overflow:visible}.app-shell.sidebar-collapsed>.sidebar .nav{width:46px;padding:0 5px;overflow:visible;gap:5px}.app-shell.sidebar-collapsed>.sidebar .nav-section,.app-shell.sidebar-collapsed>.sidebar .nav-menu-label{display:none}.app-shell.sidebar-collapsed>.sidebar .nav-item,.app-shell.sidebar-collapsed>.sidebar .nav-item.nav-subitem{position:relative;z-index:1;width:36px;min-width:36px;height:36px;min-height:36px;margin:0;padding:0 6px;gap:0;overflow:hidden;white-space:nowrap;touch-action:manipulation;-webkit-touch-callout:none;transition:width .16s ease,background .16s ease,box-shadow .16s ease,border-color .16s ease}.app-shell.sidebar-collapsed>.sidebar .nav-item>.nav-icon{width:20px;min-width:20px;margin:0 2px;flex:0 0 20px;text-align:center}.app-shell.sidebar-collapsed>.sidebar .nav-item>.nav-icon+span{display:none}.app-shell.sidebar-collapsed>.sidebar .nav-item.nav-reveal,.app-shell.sidebar-collapsed>.sidebar .nav-item:focus-visible{z-index:60;width:max-content;min-width:176px;padding-right:13px;gap:9px;overflow:visible;background:#566a76;border-color:rgba(117,196,229,.38);border-left-color:var(--brand-bright);box-shadow:5px 5px 16px rgba(28,45,55,.24)}.app-shell.sidebar-collapsed>.sidebar .nav-item.active.nav-reveal,.app-shell.sidebar-collapsed>.sidebar .nav-item.active:focus-visible{background:#356f88}.app-shell.sidebar-collapsed>.sidebar .nav-item.nav-reveal>.nav-icon+span,.app-shell.sidebar-collapsed>.sidebar .nav-item:focus-visible>.nav-icon+span{display:inline}.app-shell.sidebar-collapsed>.sidebar .sidebar-footer{width:46px;justify-content:center;padding:15px 0 16px}.app-shell.sidebar-collapsed>.sidebar .sidebar-footer #connectionText{display:none}.app-shell.sidebar-collapsed>.sidebar .sidebar-collapse{right:8px}
.workspace-placeholder{max-width:820px}.workspace-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}.workspace-action{padding:16px;border:1px solid var(--border);border-left:3px solid var(--focus);border-radius:9px;background:#fff}.workspace-action strong,.workspace-action span{display:block}.workspace-action strong{font-size:13px;font-weight:900}.workspace-action span{margin-top:5px;color:var(--muted);font-size:11px;line-height:1.45}.workspace-note{margin-top:14px;padding:11px 13px;border-radius:8px;background:var(--surface-detail);color:var(--muted);font-size:12px;line-height:1.5}
@media(max-width:900px){.app-shell.sidebar-collapsed{grid-template-columns:46px minmax(0,1fr)}.app-shell.sidebar-collapsed>.sidebar{position:relative;left:0;width:46px;height:100vh;overflow:visible}.app-shell.sidebar-collapsed>.sidebar .brand{height:48px;min-width:46px;padding:0;opacity:0;pointer-events:none}.app-shell.sidebar-collapsed>.sidebar .sidebar-inner{min-width:46px;overflow:visible}.app-shell.sidebar-collapsed>.sidebar .nav{width:46px;padding:0 5px;overflow:visible}.app-shell.sidebar-collapsed>.sidebar .nav-section,.app-shell.sidebar-collapsed>.sidebar .nav-menu-label{display:none}.app-shell.sidebar-collapsed>.sidebar .nav-item,.app-shell.sidebar-collapsed>.sidebar .nav-item.nav-subitem{width:36px;min-width:36px;padding:0 6px;gap:0;overflow:hidden}.app-shell.sidebar-collapsed>.sidebar .nav-item>.nav-icon+span{display:none}.app-shell.sidebar-collapsed>.sidebar .sidebar-footer{width:46px;justify-content:center;padding:12px 0 14px}.app-shell.sidebar-collapsed>.sidebar .sidebar-footer #connectionText{display:none}.app-shell.sidebar-collapsed>.main{grid-column:2;min-width:0}.workspace-actions{grid-template-columns:1fr}}
</style>
<script>
(function(){
  'use strict';
  var DESKTOP_REVEAL_DELAY=1600;
  var DESKTOP_REVEAL_LINGER=1800;
  var MOBILE_HOLD_DELAY=600;
  var MOBILE_REVEAL_LINGER=1800;
  var MOBILE_BREAKPOINT=900;
  var revealTimer=null;
  var holdTimer=null;
  var revealedButton=null;
  var holdButton=null;
  var holdStartX=0;
  var holdStartY=0;
  var holdTriggered=false;
  var hideTimer=null;

  function shell(){return document.getElementById('appShell');}
  function sidebar(){return document.getElementById('sidebar');}
  function collapsed(){var root=shell();return !!(root&&root.classList.contains('sidebar-collapsed'));}
  function mobile(){return window.matchMedia('(max-width:'+MOBILE_BREAKPOINT+'px)').matches;}
  function finePointer(){return window.matchMedia('(hover:hover) and (pointer:fine)').matches;}
  function navButton(target){return target&&target.closest?target.closest('.nav-item'):null;}
  function clearRevealTimer(){if(revealTimer){clearTimeout(revealTimer);revealTimer=null;}}
  function clearHoldTimer(){if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}}
  function clearHideTimer(){if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}}
  function svg(body,detail){return '<svg'+(detail?' class="nav-icon-detailed"':'')+' viewBox="0 0 24 24" aria-hidden="true">'+body+'</svg>';}
  function installVisualizedIcons(){
    var icons={
      dashboard:svg('<path d="M3 10.5 12 3l9 7.5"></path><path d="M5.5 9.5V21h13V9.5"></path><path d="M9.5 21v-6h5v6"></path>'),
      customers:svg('<circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path>'),
      addcustomer:svg('<circle cx="8.5" cy="7" r="3"></circle><path d="M3 18.5c.7-3.2 2.6-5 5.5-5 1.6 0 3 .5 4 1.5"></path><path d="M18 12.5v8M14 16.5h8"></path>'),
      addmaintenance:svg('<path d="M12 2.8c3 4 5.2 6.6 5.2 10A5.2 5.2 0 0 1 6.8 12.8c0-3.4 2.2-6 5.2-10Z"></path>'),
      tempmaintenance:svg('<rect x="3" y="4" width="15" height="15" rx="2"></rect><path d="M7 2v4M14 2v4M3 9h15"></path><circle cx="18" cy="17" r="4"></circle><path d="M18 15v2.2l1.5 1"></path>'),
      servicecall:svg('<rect x="2.5" y="3.5" width="14" height="14" rx="2"></rect><path d="M6 2v4M13 2v4M2.5 8.5h14"></path><path d="M19.4 12.2a3.4 3.4 0 0 0-4.2 4.2l-4.8 4.8 1.8 1.8 4.8-4.8a3.4 3.4 0 0 0 4.2-4.2l-2 2-1.8-1.8 2-2Z"></path>',true),
      openingclosing:svg('<circle cx="7" cy="11" r="3.2"></circle><path d="M7 4V2.5M7 19.5V18M0 11h1.5M12.5 11H14M2.1 6.1l1.1 1.1M10.8 14.8l1.1 1.1M2.1 15.9l1.1-1.1M10.8 7.2l1.1-1.1"></path><path d="M18 6v12M14.9 7.8l6.2 8.4M21.1 7.8l-6.2 8.4M13.5 12h9"></path>',true),
      routes:svg('<path d="M7 5a3 3 0 1 0-6 0c0 2.6 3 5.5 3 5.5S7 7.6 7 5Z"></path><circle cx="4" cy="5" r="1"></circle><path d="M23 5a3 3 0 1 0-6 0c0 2.6 3 5.5 3 5.5S23 7.6 23 5Z"></path><circle cx="20" cy="5" r="1"></circle><path d="M4 12v3c0 2 1.5 3 3.5 3h5c2 0 3.5-1 3.5-3s1.5-3 4-3"></path>'),
      jobs:svg('<path d="M3 6h18M3 12h18M3 18h18"></path><circle cx="8" cy="6" r="2"></circle><circle cx="15" cy="12" r="2"></circle><circle cx="10" cy="18" r="2"></circle>'),
      settings:svg('<path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4A2 2 0 0 0 4 9.9l.2.1a2 2 0 0 1 1 1.7v.6a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.6a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z"></path><circle cx="12" cy="12" r="3"></circle>',true),
      activity:svg('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path>')
    };
    Object.keys(icons).forEach(function(view){var node=document.querySelector('.nav-item[data-view="'+view+'"] .nav-icon');if(node)node.innerHTML=icons[view];});
  }
  function hideReveal(button){
    clearRevealTimer();clearHideTimer();
    var target=button||revealedButton;
    if(target)target.classList.remove('nav-reveal');
    if(!button||target===revealedButton)revealedButton=null;
  }
  function reveal(button,linger){
    if(!button||!collapsed())return;
    if(revealedButton&&revealedButton!==button)revealedButton.classList.remove('nav-reveal');
    button.classList.add('nav-reveal');revealedButton=button;
    clearHideTimer();
    if(linger)hideTimer=setTimeout(function(){hideReveal(button);},linger);
  }
  function setCollapsed(value){
    var root=shell(),toggle=document.getElementById('sidebarCollapse');if(!root)return;
    root.classList.toggle('sidebar-collapsed',!!value);
    hideReveal();
    if(toggle){toggle.title=value?'Show navigation':'Hide navigation';toggle.setAttribute('aria-label',toggle.title);}
  }
  function beginDesktopReveal(button){
    if(!button||!collapsed()||mobile()||!finePointer())return;
    clearRevealTimer();
    revealTimer=setTimeout(function(){reveal(button,DESKTOP_REVEAL_LINGER);},DESKTOP_REVEAL_DELAY);
  }
  function endDesktopReveal(button){clearRevealTimer();if(!mobile())hideReveal(button);}
  function beginHold(event,button){
    if(!button||!collapsed()||!mobile())return;
    clearHoldTimer();clearHideTimer();holdButton=button;holdTriggered=false;
    var touch=event.touches&&event.touches[0];holdStartX=touch?touch.clientX:0;holdStartY=touch?touch.clientY:0;
    holdTimer=setTimeout(function(){
      holdTimer=null;holdTriggered=true;button.dataset.pmosSuppressNav='1';reveal(button,MOBILE_REVEAL_LINGER);
      if(navigator.vibrate)try{navigator.vibrate(12);}catch(ignored){}
    },MOBILE_HOLD_DELAY);
  }
  function moveHold(event){
    if(!holdTimer)return;var touch=event.touches&&event.touches[0];if(!touch)return;
    if(Math.abs(touch.clientX-holdStartX)>12||Math.abs(touch.clientY-holdStartY)>12){clearHoldTimer();holdButton=null;}
  }
  function endHold(){
    clearHoldTimer();
    if(holdTriggered&&holdButton){
      var button=holdButton;
      setTimeout(function(){delete button.dataset.pmosSuppressNav;},450);
    }
    holdButton=null;holdTriggered=false;
  }
  function initializeMobileRail(){if(mobile())setCollapsed(true);}

  document.addEventListener('DOMContentLoaded',function(){
    installVisualizedIcons();
    initializeMobileRail();
    var nav=document.querySelector('.nav');
    if(nav){
      nav.addEventListener('mouseenter',function(event){var button=navButton(event.target);if(button)beginDesktopReveal(button);},true);
      nav.addEventListener('mouseleave',function(event){var button=navButton(event.target);if(button)endDesktopReveal(button);},true);
      nav.addEventListener('touchstart',function(event){var button=navButton(event.target);if(button)beginHold(event,button);},{passive:true});
      nav.addEventListener('touchmove',moveHold,{passive:true});
      nav.addEventListener('touchend',endHold,{passive:true});
      nav.addEventListener('touchcancel',endHold,{passive:true});
      nav.addEventListener('contextmenu',function(event){if(mobile()&&collapsed()&&navButton(event.target))event.preventDefault();});
      nav.addEventListener('click',function(event){
        var button=navButton(event.target);if(!button)return;
        if(button.dataset.pmosSuppressNav==='1'){
          event.preventDefault();event.stopImmediatePropagation();delete button.dataset.pmosSuppressNav;return;
        }
        hideReveal();
      },true);
    }
    var menu=document.getElementById('menuButton');
    if(menu)menu.addEventListener('click',function(event){
      if(!mobile())return;
      event.preventDefault();event.stopImmediatePropagation();
      var side=sidebar();if(!side)return;
      if(collapsed()){setCollapsed(false);side.classList.add('open');}
      else if(side.classList.contains('open')){side.classList.remove('open');setCollapsed(true);}
      else{side.classList.add('open');}
    },true);
    document.addEventListener('touchstart',function(event){
      if(!mobile())return;var button=navButton(event.target);if(!button&&revealedButton)hideReveal();
    },{passive:true});
  });

  document.addEventListener('pmos:viewchange',function(){
    hideReveal();
    if(mobile())setTimeout(function(){var side=sidebar();if(side)side.classList.remove('open');setCollapsed(true);},0);
  });
  window.addEventListener('resize',function(){
    hideReveal();
    if(mobile())setCollapsed(true);
  });
})();
</script>
