<style>
.op-shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;max-width:1180px}.op-nav,.op-workspace{min-width:0}.op-nav{display:grid;align-content:start;gap:7px;padding:11px}.op-nav button{display:grid;gap:3px;width:100%;padding:10px 11px;border:1px solid var(--border);border-left:4px solid transparent;border-radius:8px;background:#fff;color:var(--text);text-align:left;cursor:pointer}.op-nav button:hover{background:var(--surface-soft)}.op-nav button.active{border-left-color:var(--brand);background:#e7f3f8}.op-nav strong{font-size:12px}.op-nav span{font-size:10px;color:var(--muted);line-height:1.35}.op-workspace{display:grid;gap:14px}.op-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.op-metric{padding:12px;border:1px solid var(--border);border-left:4px solid var(--brand);border-radius:9px;background:#fff}.op-metric span{display:block;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}.op-metric strong{display:block;margin-top:5px;font-size:18px;color:var(--brand-dark)}.op-panel{padding:15px}.op-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}.op-head h2,.op-head h3{margin:0}.op-head p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.45}.op-badge{margin-left:auto;padding:5px 9px;border:1px solid #bfd9e5;border-radius:999px;background:#e4f0f5;color:var(--brand-dark);font-size:10px;font-weight:900;white-space:nowrap}.op-summary{min-height:110px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--surface-soft);white-space:pre-wrap;font-size:12px;line-height:1.5}.op-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.op-progress{height:10px;margin-top:10px;overflow:hidden;border-radius:999px;background:#d9e0e3}.op-progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--brand-dark),var(--brand-bright));transition:width .25s}.op-error{margin-top:9px;color:#8a3333;font-size:12px;font-weight:700;white-space:pre-wrap}.op-hidden{display:none!important}.op-audit-controls{display:grid;grid-template-columns:minmax(190px,1fr) 150px 150px auto;gap:9px;align-items:end}.op-audit-controls label{display:grid;gap:5px;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}.op-audit-controls input,.op-audit-controls select{min-height:38px;border:1px solid var(--border);border-radius:7px;background:#fff;padding:7px 9px;color:var(--text);font:inherit}.op-check{display:flex!important;flex-direction:row!important;align-items:center;gap:6px!important;min-height:38px;text-transform:none!important;letter-spacing:0!important}.op-check input{min-height:auto;width:auto}.op-stage{margin-top:12px;padding:11px 12px;border-left:4px solid var(--brand);border-radius:8px;background:#eef6f8;color:var(--brand-dark);font-size:12px;font-weight:800}.op-review-toolbar{display:flex;align-items:center;gap:8px;margin:12px 0 8px}.op-review-toolbar .op-selection-count{margin-left:auto;color:var(--muted);font-size:11px;font-weight:800}.op-review-list{display:grid;gap:8px;max-height:420px;overflow:auto}.op-review-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:9px;align-items:start;padding:11px;border:1px solid var(--border);border-left:4px solid var(--focus);border-radius:8px;background:#fff}.op-review-row.selected{background:#eef3f5;border-left-color:var(--brand-dark)}.op-review-row input{margin-top:3px}.op-review-copy strong{display:block;font-size:12px}.op-review-copy span{display:block;margin-top:3px;color:var(--muted);font-size:11px;line-height:1.4}.op-exception{display:none!important;width:max-content;margin-bottom:4px!important;padding:3px 7px;border-radius:999px;background:#e4f0f5;color:var(--brand-dark)!important;border:1px solid #bfd9e5;font-size:9px!important;font-weight:900}.selected .op-exception{display:inline-block!important}.op-details-button{border:1px solid var(--border);border-radius:6px;background:var(--surface-soft);padding:5px 7px;color:var(--brand-dark);font-size:10px;font-weight:900;cursor:pointer}.op-details{display:none;grid-column:2/-1;padding-top:5px;color:var(--muted);font-size:11px;line-height:1.45;white-space:pre-wrap}.op-details.open{display:block}.op-issue{padding:11px;border:1px solid var(--border);border-left:4px solid #b88735;border-radius:8px;background:#fff}.op-issue.error{border-left-color:#a6535d}.op-issue strong{display:block;font-size:12px}.op-issue p{margin:5px 0;color:var(--muted);font-size:11px;line-height:1.45;white-space:pre-wrap}.op-issue .op-resolution{margin-top:7px;padding:8px;border-radius:7px;background:#eef6f8;color:var(--brand-dark);font-size:11px}.op-history{display:grid;gap:7px;max-height:360px;overflow:auto}.op-history-row{display:grid;grid-template-columns:145px minmax(130px,.55fr) minmax(0,1fr);gap:10px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:11px}.op-history-row span{color:var(--muted)}@media(max-width:900px){.op-shell{grid-template-columns:1fr}.op-nav{grid-template-columns:repeat(2,minmax(0,1fr))}.op-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.op-audit-controls{grid-template-columns:1fr 1fr}}@media(max-width:560px){.op-nav,.op-metrics,.op-audit-controls{grid-template-columns:1fr}.op-review-row{grid-template-columns:20px minmax(0,1fr)}.op-details-button{grid-column:2}.op-history-row{grid-template-columns:1fr}}
</style>

<section class="view" id="view-jobs">
  <div class="op-shell">
    <article class="panel op-nav" id="opNav"></article>
    <div class="op-workspace">
      <div class="op-metrics" id="opMetrics">
        <div class="op-metric"><span>Status</span><strong id="opMetricStatus">Ready</strong></div>
        <div class="op-metric"><span>Remaining</span><strong id="opMetricRemaining">—</strong></div>
        <div class="op-metric"><span>Processed</span><strong id="opMetricProcessed">—</strong></div>
        <div class="op-metric"><span>Progress</span><strong id="opMetricProgress">0%</strong></div>
      </div>

      <article class="panel op-panel" id="opStandardPanel">
        <div class="op-head"><div><h2 id="opTitle">PMOS Operations</h2><p id="opDescription">Select an operation.</p></div><span id="opMode" class="op-badge">Operation</span></div>
        <div id="opSummary" class="op-summary">Select an operation.</div>
        <div class="op-progress"><div id="opProgressBar"></div></div>
        <div id="opError" class="op-error"></div>
        <div class="op-actions">
          <button id="opRun" type="button" class="button primary">Run</button>
          <button id="opPause" type="button" class="button danger op-hidden">Pause</button>
          <button id="opRefresh" type="button" class="button secondary">Refresh</button>
        </div>
      </article>

      <article class="panel op-panel op-hidden" id="opAuditPanel">
        <div class="op-head"><div><h2>Calendar Plan Audit</h2><p>Fresh audit → review exceptions → approved Calendar Sync.</p></div><span class="op-badge">Review workflow</span></div>
        <div class="op-audit-controls">
          <label>Calendar<select id="opAuditCalendar"></select></label>
          <label>Start date<input id="opAuditStart" type="date"></label>
          <label>End date<input id="opAuditEnd" type="date"></label>
          <label class="op-check"><input id="opAuditStartedToday" type="checkbox"> Include events already started today</label>
        </div>
        <div id="opAuditStage" class="op-stage">Ready for a fresh audit.</div>
        <div class="op-actions"><button id="opRunAudit" type="button" class="button primary">Run Fresh Audit</button><button id="opReloadReview" type="button" class="button secondary">Reload Review State</button></div>
        <div id="opAuditBody" style="margin-top:12px"></div>
      </article>

      <article class="panel op-panel">
        <div class="op-head"><div><h3>Job History</h3><p>Recent PMOS operational jobs.</p></div><button id="opRefreshHistory" type="button" class="button secondary">Refresh</button></div>
        <div id="opHistory" class="op-history"></div>
      </article>
    </div>
  </div>
</section>

<script>
(function(){
  'use strict';
  const state={initialized:false,definitions:[],selectedType:'CALENDAR_STATUS',busy:false,sync:{},auditOptions:{},review:null,history:[],poll:null};
  const $=id=>document.getElementById(id);
  const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function call(name,...args){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error&&error.message?error.message:String(error))));runner[name](...args);});}
  function definition(){return state.definitions.find(item=>item.type===state.selectedType)||state.definitions[0]||{};}
  function setBusy(value){state.busy=!!value;renderControls();}
  function setError(error){$('opError').textContent=error?String(error.message||error):'';}
  function setProgress(percent){const value=Math.max(0,Math.min(100,Number(percent||0)));$('opProgressBar').style.width=value+'%';$('opMetricProgress').textContent=Math.round(value)+'%';}
  function processing(sync){return['Running','Scheduled','Waiting','Waiting for Google'].includes(String(sync&&sync.status||''));}
  function renderNav(){$('opNav').innerHTML=state.definitions.map(item=>'<button type="button" data-type="'+esc(item.type)+'" class="'+(item.type===state.selectedType?'active':'')+'"><strong>'+esc(item.label)+'</strong><span>'+esc(item.description)+'</span></button>').join('');$('opNav').querySelectorAll('button').forEach(button=>button.onclick=()=>selectOperation(button.dataset.type));}
  function selectOperation(type){state.selectedType=String(type||'');call('rememberPmosJobType',state.selectedType).catch(()=>{});renderNav();renderSelected();}
  function renderSelected(){const item=definition(),audit=item.mode==='audit',runtime=item.mode==='runtime';$('opAuditPanel').classList.toggle('op-hidden',!audit);$('opStandardPanel').classList.toggle('op-hidden',audit);$('opMetrics').classList.toggle('op-hidden',audit);if(audit){renderAudit();return;}$('opTitle').textContent=item.label||'PMOS Operations';$('opDescription').textContent=item.description||'';$('opMode').textContent=runtime?'Reviewed queue':item.mode==='repair'?'Recovery / repair':'Operation';if(runtime)renderSync();else if(item.mode==='repair')renderRepair();else{$('opMetricStatus').textContent='Ready';$('opMetricRemaining').textContent='—';$('opMetricProcessed').textContent='—';setProgress(0);$('opSummary').textContent='Ready to run '+(item.label||'operation')+'.';setError('');}renderControls();}
  function renderControls(){const item=definition(),runtime=item.mode==='runtime',sync=state.sync||{},isProcessing=runtime&&processing(sync),paused=String(sync.status||'')==='Paused',failed=String(sync.status||'')==='Paused on error';$('opRun').disabled=state.busy||isProcessing||(runtime&&String(sync.status||'')==='Complete');$('opRefresh').disabled=state.busy;$('opPause').classList.toggle('op-hidden',!isProcessing);$('opPause').disabled=state.busy;if(runtime)$('opRun').textContent=failed?'Retry After Recovery':paused?'Resume':'Start / Continue';else if(item.mode==='repair')$('opRun').textContent='Refresh Recovery Status';else $('opRun').textContent='Run';}
  async function runSelected(){const item=definition();if(item.mode==='runtime')return runSync();if(item.mode==='repair')return loadRepair();setBusy(true);setError('');$('opMetricStatus').textContent='Running';$('opSummary').textContent='Running '+item.label+'…';try{const result=await call('runPmosWebOperationTask',item.type);$('opMetricStatus').textContent='Complete';$('opSummary').textContent=result&&result.summary||'Operation completed.';setProgress(100);refreshHistory();}catch(error){$('opMetricStatus').textContent='Needs attention';setError(error);}finally{setBusy(false);}}
  async function refreshTask(){if(definition().mode==='runtime')return loadSync();if(definition().mode==='repair')return loadRepair();renderSelected();}
  function renderSync(){const sync=state.sync||{},total=Number(sync.originalTotal||0),remaining=sync.remaining==null?null:Number(sync.remaining),percent=String(sync.status||'')==='Complete'?100:(total>0&&remaining!=null?Math.round((total-remaining)/total*100):0);$('opMetricStatus').textContent=sync.status||'Not prepared';$('opMetricRemaining').textContent=remaining==null?'—':String(remaining);$('opMetricProcessed').textContent=String(sync.processedItems||0);setProgress(percent);$('opSummary').textContent=sync.lastSummary||((sync.status==='Not prepared'||!sync.status)?'Run Calendar Plan Audit and complete review before starting Calendar Sync.':'');setError(sync.lastError||'');renderControls();if(processing(sync))startPolling();else stopPolling();}
  async function loadSync(){try{state.sync=await call('getPmosWebCalendarSyncStatus');if(definition().mode==='runtime')renderSync();}catch(error){setError(error);}}
  async function runSync(){const sync=state.sync||{},failed=String(sync.status||'')==='Paused on error',paused=String(sync.status||'')==='Paused',fn=failed?'retryPmosWebCalendarSync':paused?'resumePmosWebCalendarSync':'startPmosWebCalendarSync';setBusy(true);setError('');try{state.sync=await call(fn);renderSync();refreshHistory();}catch(error){setError(error);}finally{setBusy(false);}}
  async function pauseSync(){setBusy(true);try{state.sync=await call('pausePmosWebCalendarSync');renderSync();}catch(error){setError(error);}finally{setBusy(false);}}
  function startPolling(){if(state.poll)return;state.poll=setInterval(loadSync,2000);}
  function stopPolling(){if(state.poll){clearInterval(state.poll);state.poll=null;}}
  async function loadRepair(){setBusy(true);setError('');$('opMetricStatus').textContent='Loading';try{const result=await call('getPmosWebCalendarRecoverySummary');$('opMetricStatus').textContent='Ready';$('opMetricRemaining').textContent='—';$('opMetricProcessed').textContent=String(result.transactionRows||0);setProgress(0);$('opSummary').textContent='Calendar transaction ledger: '+(result.transactionSheetPresent?'available':'not present')+'\nTransaction rows: '+Number(result.transactionRows||0)+'\n\nCalendar Repair and Transaction Recovery remain isolated from normal Calendar Sync. Recovery actions that mutate historical Calendar state are not exposed here until their existing repair previews are migrated into Web-native review controls.';}catch(error){$('opMetricStatus').textContent='Needs attention';setError(error);}finally{setBusy(false);}}
  function auditStage(review){if(!review)return'Ready for a fresh audit.';if(review.hasErrors)return'Errors require correction before review can continue.';if(review.hasWarnings)return'Warnings require review/correction before review can continue.';if(review.hasSuggestedMatches)return'Suggested Matches — unselected = match; selected = exempt from matching.';if(review.hasUnclassifiedEvents)return'Unclassified Events — unselected = Temporary Maintenance; selected = IGNORE FOR THIS SYNC.';if(Number(review.deletionCandidateCount||0)>0)return'Suggested Deletions — unselected = delete; selected = keep.';if(review.reviewComplete)return'Review complete. Calendar Sync is ready.';return'No unresolved review items were found.';}
  function renderAudit(){const options=state.auditOptions||{};$('opAuditCalendar').innerHTML=(options.calendarNames||[]).map(name=>'<option value="'+esc(name)+'">'+esc(name)+'</option>').join('');if(!$('opAuditCalendar').value)$('opAuditCalendar').value=options.calendarName||'';if(!$('opAuditStart').value)$('opAuditStart').value=options.startDate||'';if(!$('opAuditEnd').value)$('opAuditEnd').value=options.endDate||'';$('opAuditStartedToday').checked=!!options.includeStartedToday;$('opAuditStage').textContent=auditStage(state.review);renderAuditBody();}
  function renderAuditBody(){const review=state.review,box=$('opAuditBody');if(!review){box.innerHTML='<div class="op-summary">Run a fresh Calendar Plan Audit to create a new Review Session.</div>';return;}if(review.hasErrors){renderIssues(review.errors||[],'error');return;}if(review.hasWarnings){renderIssues(review.warnings||[],'warning');return;}if(review.hasSuggestedMatches){renderReview('SUGGESTED_MATCH',review.suggestedMatches||[]);return;}if(review.hasUnclassifiedEvents){renderReview('UNCLASSIFIED_EVENT',review.unclassifiedEvents||[]);return;}if(Number(review.deletionCandidateCount||0)>0){renderReview('DELETION_CANDIDATE',review.deletionCandidates||[]);return;}if(review.reviewComplete){box.innerHTML='<div class="op-summary"><b>Review complete.</b> The reviewed Calendar queue is ready for Calendar Sync.</div><div class="op-actions"><button type="button" class="button primary" id="opGoSync">Open Calendar Sync</button></div>';setTimeout(()=>{const button=$('opGoSync');if(button)button.onclick=()=>selectOperation('CALENDAR_SYNC');},0);return;}box.innerHTML='<div class="op-summary">'+esc(review.summary||'Audit completed with no unresolved review items.')+'</div>';}
  function renderIssues(items,severity){const box=$('opAuditBody');box.innerHTML='<div class="op-review-list">'+items.map((item,index)=>{const resolution=item.resolution||{},action=resolution.type&&resolution.type!=='NONE'?'<button type="button" class="button secondary op-issue-action" data-index="'+index+'">'+esc(resolution.label||'Resolve')+'</button>':'';return'<div class="op-issue '+(severity==='error'?'error':'')+'"><strong>'+esc(item.title||severity)+'</strong><p>'+esc(item.details||'')+'</p>'+(resolution.explanation?'<div class="op-resolution">'+esc(resolution.explanation)+'</div>':'')+(action?'<div class="op-actions">'+action+'</div>':'')+'</div>';}).join('')+'</div>';box.querySelectorAll('.op-issue-action').forEach(button=>button.onclick=()=>resolveIssue(items[Number(button.dataset.index)]));}
  async function resolveIssue(issue){const resolution=issue&&issue.resolution||{};if(!resolution.type)return;setAuditBusy(true);try{const result=await call('performPmosWebCalendarIssueResolution',resolution.type,issue);if(result&&result.openReviewType){state.review=result.reviewState||state.review;renderAudit();}else{alert(result&&result.summary||result&&result.message||'Resolution action completed.');await loadReview();}}catch(error){alert(error.message);}finally{setAuditBusy(false);}}
  function renderReview(type,items){const rules={SUGGESTED_MATCH:{title:'Suggested Customer Matches',instruction:'Unselected events will be matched. Select only exceptions.',badge:'EXEMPT FROM MATCHING',save:'Approve Matches'},UNCLASSIFIED_EVENT:{title:'Unclassified Calendar Events',instruction:'Unselected events become Temporary Maintenance. Select only events to ignore for this sync.',badge:'IGNORE FOR THIS SYNC',save:'Continue Review'},DELETION_CANDIDATE:{title:'Suggested Calendar Deletions',instruction:'Unselected events will be deleted. Select only events that should be kept.',badge:'KEEP THIS EVENT',save:'Complete Deletion Review'}},rule=rules[type],box=$('opAuditBody');box.innerHTML='<div class="op-head"><div><h3>'+esc(rule.title)+'</h3><p>'+esc(rule.instruction)+'</p></div></div><div class="op-review-toolbar"><button type="button" class="button secondary" id="opToggleAll">Select All</button><span class="op-selection-count" id="opSelectionCount"></span></div><div class="op-review-list" id="opReviewList">'+items.map((item,index)=>reviewRow(type,item,index,rule)).join('')+'</div><div class="op-actions"><button type="button" class="button primary" id="opSaveReview">'+esc(rule.save)+'</button></div>';const rows=Array.from(box.querySelectorAll('.op-review-row'));function refresh(){const selected=rows.filter(row=>row.querySelector('input').checked);rows.forEach(row=>row.classList.toggle('selected',row.querySelector('input').checked));$('opSelectionCount').textContent=selected.length+' selected';$('opToggleAll').textContent=selected.length===rows.length&&rows.length?'Clear All':'Select All';}rows.forEach(row=>{row.querySelector('input').addEventListener('change',refresh);const detail=row.querySelector('.op-details-button');if(detail)detail.onclick=()=>row.querySelector('.op-details').classList.toggle('open');});$('opToggleAll').onclick=()=>{const all=rows.length&&rows.every(row=>row.querySelector('input').checked);rows.forEach(row=>row.querySelector('input').checked=!all);refresh();};$('opSaveReview').onclick=()=>saveReview(type,items,rows);refresh();}
  function reviewRow(type,item,index,rule){const checked=item.selected?' checked':'',recurring=item.recurring?'Recurring':'One-time',heading=item.title||item.seriesKey||'Calendar event',meta=[];if(type==='SUGGESTED_MATCH'){meta.push('→ '+String(item.customerName||''));if(item.confidence!=null)meta.push('Confidence '+Number(item.confidence||0)+'%');}else if(type==='UNCLASSIFIED_EVENT'){if(item.start)meta.push(String(item.start).replace('T',' ').slice(0,16));if(item.location)meta.push(item.location);}else{if(item.layer)meta.push('Route: '+item.layer);if(item.seriesKey)meta.push('Series: '+item.seriesKey);}const details=[item.reason,item.description,item.customerAddress,item.location].filter(Boolean).join('\n');return'<div class="op-review-row'+(checked?' selected':'')+'" data-index="'+index+'"><input type="checkbox"'+checked+'><div class="op-review-copy"><span class="op-exception">'+esc(rule.badge)+'</span><strong>'+esc(heading)+'</strong><span>'+esc(recurring+(meta.length?' · '+meta.join(' · '):''))+'</span></div><button type="button" class="op-details-button">Details</button><div class="op-details">'+esc(details||'No additional details.')+'</div></div>';}
  async function saveReview(type,items,rows){const selected=rows.filter(row=>row.querySelector('input').checked).map(row=>Number(row.dataset.index));if(type==='DELETION_CANDIDATE'){const deleteCount=items.length-selected.length;if(deleteCount>0&&!confirm('Delete '+deleteCount+' unselected Calendar event(s) and keep '+selected.length+' selected event(s)?'))return;}setAuditBusy(true);try{const result=await call('savePmosWebCalendarReviewStep',type,selected);state.review=result.reviewState||null;renderAudit();await loadSync();}catch(error){alert(error.message);}finally{setAuditBusy(false);}}
  function setAuditBusy(value){state.busy=!!value;['opRunAudit','opReloadReview','opAuditCalendar','opAuditStart','opAuditEnd','opAuditStartedToday'].forEach(id=>{if($(id))$(id).disabled=value;});}
  async function runAudit(){const options={calendarName:$('opAuditCalendar').value,startDate:$('opAuditStart').value,endDate:$('opAuditEnd').value,includeStartedToday:$('opAuditStartedToday').checked};if(!options.calendarName||!options.startDate||!options.endDate){alert('Choose a Calendar and both audit dates.');return;}if(options.startDate>options.endDate){alert('The audit start date cannot be after the end date.');return;}setAuditBusy(true);$('opAuditStage').textContent='Running fresh Calendar Plan Audit…';$('opAuditBody').innerHTML='<div class="op-summary">Building a new Review Session from verified Calendar state…</div>';try{const response=await call('runFreshPmosWebCalendarAudit',options);state.review=response.reviewState||null;renderAudit();await loadSync();refreshHistory();}catch(error){$('opAuditStage').textContent='Needs attention';$('opAuditBody').innerHTML='<div class="op-error">'+esc(error.message)+'</div>';}finally{setAuditBusy(false);}}
  async function loadReview(){try{state.review=await call('getPmosWebCalendarReviewState');renderAudit();}catch(error){$('opAuditBody').innerHTML='<div class="op-error">'+esc(error.message)+'</div>';}}
  function renderHistory(){const box=$('opHistory');box.innerHTML=state.history.length?state.history.map(item=>'<div class="op-history-row"><span>'+esc(item.timestamp)+'</span><b>'+esc(item.jobName||item.jobType)+'</b><div>'+esc(item.result||'')+(item.summary?'<br><span>'+esc(item.summary)+'</span>':'')+'</div></div>').join(''):'<div class="empty">No PMOS job history has been recorded yet.</div>';}
  async function refreshHistory(){try{state.history=await call('getPmosWebJobHistory',30);renderHistory();}catch(error){$('opHistory').innerHTML='<div class="op-error">'+esc(error.message)+'</div>';}}
  async function init(){if(state.initialized)return;state.initialized=true;try{const data=await call('getPmosWebOperationsBootstrap');state.definitions=data.definitions||[];state.selectedType=state.definitions.some(item=>item.type===data.selectedType)?data.selectedType:'CALENDAR_STATUS';state.sync=data.syncStatus||{};state.auditOptions=data.auditOptions||{};state.history=data.jobHistory||[];renderNav();renderHistory();renderSelected();if(state.selectedType==='CALENDAR_AUDIT')loadReview();}catch(error){$('opNav').innerHTML='<div class="op-error">'+esc(error.message)+'</div>';} }
  $('opRun').addEventListener('click',runSelected);$('opPause').addEventListener('click',pauseSync);$('opRefresh').addEventListener('click',refreshTask);$('opRunAudit').addEventListener('click',runAudit);$('opReloadReview').addEventListener('click',loadReview);$('opRefreshHistory').addEventListener('click',refreshHistory);
  document.addEventListener('pmos:viewchange',event=>{if(event.detail&&event.detail.name==='jobs'){init();if(state.selectedType==='CALENDAR_AUDIT'&&state.initialized)loadReview();if(state.selectedType==='CALENDAR_SYNC'&&state.initialized)loadSync();}});
  document.addEventListener('pmos:refresh',()=>{if(state.initialized){loadSync();refreshHistory();}});
})();
</script>
