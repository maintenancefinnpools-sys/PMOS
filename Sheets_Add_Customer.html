    <script>
      window.pmosActivateEquipmentScope=function(storeId){
        var current=document.getElementById('waterBodies');
        var inferStore=function(node){
          if(!node)return'';
          var explicit=node.getAttribute('data-pmos-store-id');
          if(explicit)return explicit;
          if(node.closest&&node.closest('#view-addcustomer'))return'acWaterBodiesStore';
          if(node.closest&&node.closest('#slBackdrop'))return'slWaterBodiesStore';
          return'';
        };
        if(current){
          var currentStore=inferStore(current);
          if(currentStore===storeId){
            current.setAttribute('data-pmos-store-id',storeId);
            Array.prototype.forEach.call(current.querySelectorAll('.pmos-water-body-inactive'),function(node){node.classList.remove('pmos-water-body-inactive');node.classList.add('water-body');});
            return current;
          }
          Array.prototype.forEach.call(current.querySelectorAll('.water-body'),function(node){node.classList.remove('water-body');node.classList.add('pmos-water-body-inactive');});
          current.setAttribute('data-pmos-store-id',currentStore||('pmosWaterBodiesStore_'+Date.now()));
          current.id=current.getAttribute('data-pmos-store-id');
        }
        var target=document.getElementById(storeId)||document.querySelector('[data-pmos-store-id="'+storeId+'"]');
        if(!target)return null;
        target.setAttribute('data-pmos-store-id',storeId);
        target.id='waterBodies';
        Array.prototype.forEach.call(target.querySelectorAll('.pmos-water-body-inactive'),function(node){node.classList.remove('pmos-water-body-inactive');node.classList.add('water-body');});
        return target;
      };
    </script>

      document.addEventListener('pmos:open-customer',function(event){
        var customerId=event.detail&&event.detail.customerId;

        google.script.run
          .withSuccessHandler(function(){google.script.host.close();})
