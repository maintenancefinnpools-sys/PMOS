<script>
(function(){
  'use strict';
  const state={bootstrap:null,data:null,activeRoute:'',routeOrder:[],dirty:false,dragIndex:null,confirmAction:null,currentView:'dashboard'};
  const viewMeta={
    dashboard:['Dashboard','Operational status and route overview'],
    addcustomer:['Add Customer','Create a non-maintenance customer account'],
    addmaintenance:['Add Maintenance Client','Create a maintenance client using the existing PMOS workflow'],
    customers:['Customer Look-Up','Search PMOS customers and open customer profiles'],
    servicecall:['Service Call','Schedule customer service work through PMOS'],
    tempmaintenance:['Temporary Maintenance','Schedule temporary maintenance visits through PMOS'],
    openingclosing:['Opening / Closing','Schedule seasonal opening and closing work through PMOS'],
    jobs:['PMOS Operations','PMOS jobs, audits, review workflows, synchronization, and recovery'],
    routes:['Route Manager','Route tools and route order management'],
    settings:['Settings','PMOS application and operational settings'],
    activity:['Activity & History','System activity, changes, and historical records']
  };
  const $=id=>document.getElementById(id);
  function server(name,...args){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error&&error.message?error.message:String(error))));runner[name](...args);});}
  function esc(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
  function setBusy(text){$('saveState').textContent=text||'Working…';}
  function notify(message,type='info'){const el=document.createElement('div');el.className=`alert ${type}`;el.textContent=message;$('alertRegion').prepend(el);setTimeout(()=>el.remove(),6000);}
  function setConnection(ok,text){$('connectionDot').className=`status-dot ${ok?'online':'error'}`;$('connectionText').textContent=text;}
  function showView(name){
    if(!viewMeta[name]||!$(`view-${name}`))return;
    state.currentView=name;
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(v=>v.classList.toggle('active',v.dataset.view===name));
    $(`view-${name}`).classList.add('active');
    $('viewTitle').textContent=viewMeta[name][0];
    $('viewSubtitle').textContent=viewMeta[name][1];
    $('sidebar').classList.remove('open');
    document.dispatchEvent(new CustomEvent('pmos:viewchange',{detail:{name:name}}));
  }
  function renderFeatureViews(){
    const cards={
      servicecall:{title:'Service Call',copy:'This Scheduling workflow will create and route customer service work through PMOS.'},
      openingclosing:{title:'Opening / Closing',copy:'This Scheduling workflow will use one entry point with Opening or Closing selected inside the form, allowing the downstream reporting workflow to follow the scheduled work type.'}
    };
    Object.entries(cards).forEach(([id,content])=>{
      $(`view-${id}`).innerHTML=`<article class="panel workspace-placeholder"><div class="panel-heading"><div><h2>${esc(content.title)}</h2><p>Web App development</p></div></div><p>${esc(content.copy)}</p></article>`;
    });
  }
  async function load(){
    setBusy('Loading…');
    try{
      const [bootstrap,data]=await Promise.all([server('getPmosWebAppBootstrap'),server('getRouteManagerData')]);
      state.bootstrap=bootstrap;
      state.data=data;
      setConnection(true,`${bootstrap.spreadsheetName} · connected`);
      populateRoutes();
      renderAll();
      $('saveState').textContent='Ready';
    }catch(error){
      setConnection(false,'Connection failed');
      $('saveState').textContent='Error';
      notify(error.message,'error');
    }
  }
  function populateRoutes(){const names=state.data.routeNames||[];const opts=names.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join('');$('routeSelect').innerHTML=opts;if(!state.activeRoute||!names.includes(state.activeRoute))state.activeRoute=names[0]||'';$('routeSelect').value=state.activeRoute;resetRouteOrder();}
  function routesFor(layer){return (state.data.routes||[]).filter(r=>r.layer===layer).sort((a,b)=>Number(a.order)-Number(b.order));}
  function resetRouteOrder(){state.routeOrder=routesFor(state.activeRoute).map(r=>r.key);state.dirty=false;$('saveRouteButton').disabled=true;}
  function renderAll(){renderDashboard();renderRoute();renderHistory();}
  function renderDashboard(){const names=state.data.routeNames||[],routes=state.data.routes||[],pending=state.data.pending||[],versions=state.data.versions||[];$('metricRoutes').textContent=names.length;$('metricCustomers').textContent=routes.length;$('metricPending').textContent=pending.length;$('metricVersions').textContent=versions.length;$('routeOverview').innerHTML=names.length?names.map(name=>`<div class="summary-row"><span>${esc(name)}</span><strong>${routesFor(name).length}</strong></div>`).join(''):'<div class="empty">No route layers found.</div>';$('pendingOverview').innerHTML=pending.length?pending.map(p=>`<div class="summary-row"><span><b>${esc(p.layer||p[0]||'Route')}</b><br><small>${esc(p.reason||p[4]||'Pending change')}</small></span></div>`).join(''):'<div class="empty">Everything is synchronized.</div>';}
  function orderedRoute(){const map=new Map(routesFor(state.activeRoute).map(r=>[String(r.key),r]));return state.routeOrder.map(k=>map.get(String(k))).filter(Boolean);}
  function renderRoute(){const search=$('routeSearch').value.trim().toLowerCase(),route=orderedRoute();$('routeHeading').textContent=state.activeRoute||'Route';$('routeCount').textContent=`${route.length} stops`;const visible=route.map((r,index)=>({r,index})).filter(x=>!search||`${x.r.title} ${x.r.fullName} ${x.r.address}`.toLowerCase().includes(search));$('routeList').innerHTML=visible.length?visible.map(({r,index})=>`<div class="route-stop" draggable="true" data-index="${index}"><div class="stop-number">${index+1}</div><div class="stop-details"><strong>${esc(r.title)}</strong><span>${esc(r.address||r.fullName||'No address')}</span></div><div class="stop-actions"><button class="icon-button move-up" data-index="${index}" aria-label="Move up">↑</button><button class="icon-button move-down" data-index="${index}" aria-label="Move down">↓</button></div></div>`).join(''):'<div class="empty">No matching stops.</div>';bindRouteEvents();}
  function bindRouteEvents(){document.querySelectorAll('.move-up').forEach(b=>b.onclick=()=>move(Number(b.dataset.index),-1));document.querySelectorAll('.move-down').forEach(b=>b.onclick=()=>move(Number(b.dataset.index),1));document.querySelectorAll('.route-stop').forEach(el=>{el.ondragstart=()=>{state.dragIndex=Number(el.dataset.index);el.classList.add('dragging')};el.ondragend=()=>{state.dragIndex=null;el.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'))};el.ondragover=e=>{e.preventDefault();el.classList.add('drag-over')};el.ondragleave=()=>el.classList.remove('drag-over');el.ondrop=e=>{e.preventDefault();const to=Number(el.dataset.index);el.classList.remove('drag-over');if(state.dragIndex!==null&&state.dragIndex!==to){const [key]=state.routeOrder.splice(state.dragIndex,1);state.routeOrder.splice(to,0,key);markDirty();renderRoute();}};});}
  function move(index,delta){const target=index+delta;if(target<0||target>=state.routeOrder.length)return;[state.routeOrder[index],state.routeOrder[target]]=[state.routeOrder[target],state.routeOrder[index]];markDirty();renderRoute();}
  function markDirty(){state.dirty=true;$('saveRouteButton').disabled=false;$('saveState').textContent='Unsaved changes';}
  async function saveRoute(){setBusy('Saving…');$('saveRouteButton').disabled=true;try{const result=await server('saveRouteOrder',{layer:state.activeRoute,customerKeys:state.routeOrder});replaceRoute(result.route);state.data.pending=result.pending||[];resetRouteOrder();renderAll();$('saveState').textContent='Saved';notify(`${state.activeRoute} was saved and marked pending.`,'success');}catch(error){$('saveRouteButton').disabled=false;$('saveState').textContent='Save failed';notify(error.message,'error');}}
  function replaceRoute(route){state.data.routes=(state.data.routes||[]).filter(r=>r.layer!==state.activeRoute).concat(route||[]);}
  function renderHistory(){const versions=state.data.versions||[];$('historyList').innerHTML=versions.length?versions.map(v=>`<div class="history-row"><div class="history-info"><strong>${esc(v.label)}</strong><span>${esc(v.timestamp)}</span></div><button class="button secondary restore-button" data-id="${esc(v.id)}">Restore</button></div>`).join(''):'<div class="empty">No saved route versions.</div>';document.querySelectorAll('.restore-button').forEach(b=>b.onclick=()=>confirmAction('Restore route version?','Current routes will be backed up before this version is restored.',()=>restoreVersion(b.dataset.id)));}
  async function restoreVersion(id){setBusy('Restoring…');try{const result=await server('restoreRouteVersion',id);state.data.routes=result.routes||[];state.data.pending=result.pending||[];resetRouteOrder();renderAll();$('saveState').textContent='Restored';notify('Route version restored. Calendar changes remain pending until reviewed.','success');}catch(error){$('saveState').textContent='Restore failed';notify(error.message,'error');}}
  function confirmAction(title,message,action){$('confirmTitle').textContent=title;$('confirmMessage').textContent=message;state.confirmAction=action;$('confirmModal').hidden=false;}
  function toggleSidebar(){const collapsed=$('appShell').classList.toggle('sidebar-collapsed'),button=$('sidebarCollapse');button.title=collapsed?'Show navigation':'Hide navigation';button.setAttribute('aria-label',button.title);}
  function initEvents(){
    document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>showView(b.dataset.view));
    $('menuButton').onclick=()=>$('sidebar').classList.toggle('open');
    $('sidebarCollapse').onclick=toggleSidebar;
    $('refreshButton').onclick=()=>{if(state.dirty&&!confirm('Discard unsaved route order and refresh?'))return;load();document.dispatchEvent(new CustomEvent('pmos:refresh'));};
    $('routeSelect').onchange=e=>{if(state.dirty&&!confirm('Discard unsaved route order?')){e.target.value=state.activeRoute;return;}state.activeRoute=e.target.value;resetRouteOrder();renderRoute()};
    $('routeSearch').oninput=renderRoute;
    $('saveRouteButton').onclick=saveRoute;
    $('confirmCancel').onclick=()=>{$('confirmModal').hidden=true;state.confirmAction=null};
    $('confirmAccept').onclick=()=>{const action=state.confirmAction;$('confirmModal').hidden=true;state.confirmAction=null;if(action)action()};
  }
  document.addEventListener('DOMContentLoaded',()=>{renderFeatureViews();initEvents();load();});
})();
</script>
