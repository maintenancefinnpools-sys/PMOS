name: Tweak Temporary Visit Confirmation Text
on:
  push:
    branches: [pmos-development]
    paths: ['.github/temp-confirmed-message.trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
      - name: Remove duplicate confirmed wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('06-D_Temporary_Visit_UI_V3.gs')
          s=p.read_text()
          old="addressMessage('Address confirmed. Searching for the best route options…');"
          new="addressMessage('Searching for the best route options…');"
          if old not in s:
              raise SystemExit('Target confirmation message not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'PMOS GitHub Actions'
          git config user.email 'maintenance.finnpools@gmail.com'
          git add 06-D_Temporary_Visit_UI_V3.gs
          git commit -m 'Remove duplicate Temporary Visit confirmation wording'
          git push origin HEAD:pmos-development
