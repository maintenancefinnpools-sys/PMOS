name: Final PMOS UI polish
on:
  push:
    branches: [pmos-development]
    paths: ['.github/final-ui-polish.trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
      - name: Apply final UI polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Add Maintenance Client: give Address most of the row and keep Frequency compact.
          p = Path('20-C_Add_Maintenance_Client_UI.gs')
          s = p.read_text()
          css_old = ".grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:16px}.full{grid-column:1/-1}label"
          css_new = ".grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:16px}.full{grid-column:1/-1}.address-frequency-row{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 175px;gap:14px}label"
          if css_old not in s:
              raise SystemExit('Add Maintenance CSS target not found')
          s = s.replace(css_old, css_new, 1)
          mobile_old = ".recommendations,.manual-grid,.body-grid,.equipment-grid,.chemistry-fields{grid-template-columns:1fr}}"
          mobile_new = ".recommendations,.manual-grid,.body-grid,.equipment-grid,.chemistry-fields{grid-template-columns:1fr}.address-frequency-row{grid-template-columns:1fr}}"
          if mobile_old not in s:
              raise SystemExit('Add Maintenance mobile CSS target not found')
          s = s.replace(mobile_old, mobile_new, 1)
          row_old = '<label>Service address<div class="address-wrap"><input id="address" autocomplete="off" placeholder="Begin typing address" oninput="beginAddressSearch(this.value)" onfocus="beginAddressSearch(this.value)" onpaste="setTimeout(function(){beginAddressSearch(document.getElementById(\'address\').value)},0)"><div id="addressList" class="address-list"></div></div></label><label>Frequency<select id="frequency"><option>Weekly</option><option>Biweekly</option><option>Monthly</option><option>Twice Weekly</option></select></label>'
          row_new = '<div class="address-frequency-row"><label>Service address<div class="address-wrap"><input id="address" autocomplete="off" placeholder="Begin typing address" oninput="beginAddressSearch(this.value)" onfocus="beginAddressSearch(this.value)" onpaste="setTimeout(function(){beginAddressSearch(document.getElementById(\'address\').value)},0)"><div id="addressList" class="address-list"></div></div></label><label>Frequency<select id="frequency"><option>Weekly</option><option>Biweekly</option><option>Monthly</option><option>Twice Weekly</option></select></label></div>'
          if row_old not in s:
              raise SystemExit('Add Maintenance address/frequency row target not found')
          p.write_text(s.replace(row_old, row_new, 1))

          # 2) Temporary Visit: immediate visible scheduling state on the confirmation button.
          p = Path('06-D_Temporary_Visit_UI_V3.gs')
          s = p.read_text()
          css_old = '.primary{background:#2563eb;color:#fff}.secondary'
          css_new = '.primary{background:#2563eb;color:#fff;transition:background .18s ease}.primary.scheduling{background:#1d4ed8}.primary.scheduled{background:#2f7d57}.secondary'
          if css_old not in s:
              raise SystemExit('Temporary Visit primary button CSS target not found')
          s = s.replace(css_old, css_new, 1)
          start_old = "save.disabled=true;setStatus('Creating temporary visit(s) and restaggering the selected route(s)…');"
          start_new = "save.disabled=true;save.textContent='Scheduling…';save.classList.remove('scheduled');save.classList.add('scheduling');setStatus('Creating temporary visit(s) and restaggering the selected route(s)…');"
          if start_old not in s:
              raise SystemExit('Temporary Visit scheduling-start target not found')
          s = s.replace(start_old, start_new, 1)
          success_old = "withSuccessHandler(function(r){save.disabled=false;setStatus(r.created+' temporary visit(s) created."
          success_new = "withSuccessHandler(function(r){save.disabled=false;save.classList.remove('scheduling');save.classList.add('scheduled');save.textContent='Scheduled ✓';setStatus(r.created+' temporary visit(s) created."
          if success_old not in s:
              raise SystemExit('Temporary Visit success target not found')
          s = s.replace(success_old, success_new, 1)
          failure_old = "withFailureHandler(function(e){save.disabled=false;setStatus(e&&e.message?e.message:String(e),'error')})"
          failure_new = "withFailureHandler(function(e){save.disabled=false;save.classList.remove('scheduling');save.textContent='Schedule Visit(s)';setStatus(e&&e.message?e.message:String(e),'error')})"
          if failure_old not in s:
              raise SystemExit('Temporary Visit failure target not found')
          p.write_text(s.replace(failure_old, failure_new, 1))

          # 3) Customer Editor: normalize/pre-fill Frequency and collapse manual placement by default.
          p = Path('24-E_Customer_Editor.gs')
          s = p.read_text()
          manual_old = '<button id="moreRecommendations" type="button" class="add-link" style="display:none;margin:10px 0 0">Show more suggestions</button><div style="margin-top:12px;padding:11px;border:1px solid #cedce2;border-radius:9px;background:#f8fafb"><div style="margin-bottom:9px;font-size:11px;font-weight:900">Manual route placement</div>'
          manual_new = '<button id="moreRecommendations" type="button" class="add-link" style="display:none;margin:10px 0 0">Show more suggestions</button><button id="manualRouteToggle" type="button" class="add-link" style="display:block;margin:10px 0 0;padding:0">Select route placement manually</button><div id="manualRoutePanel" style="display:none;margin-top:12px;padding:11px;border:1px solid #cedce2;border-radius:9px;background:#f8fafb"><div style="margin-bottom:9px;font-size:11px;font-weight:900">Manual route placement</div>'
          if manual_old not in s:
              raise SystemExit('Customer Editor manual placement target not found')
          s = s.replace(manual_old, manual_new, 1)
          fill_old = "function fill(data){loaded=data;editToken=data.editToken;originalAddress=data.address||'';el('heading').textContent=data.displayName+' · '+data.customerId;['firstName','lastName','address','phone','email','calendarTitle','frequency','serviceStartDate','entryInformation','notes'].forEach(function(id){el(id).value=data[id]||''});formatPmosPhoneInput(el('phone'));"
          fill_new = "function editorFrequencyValue(value,routes){var f=norm(value);if(!f){var weeks={},days={};(routes||[]).forEach(function(r){if(r.week)weeks[String(r.week)]=true;if(r.day)days[String(r.day)]=true});var wc=Object.keys(weeks).length,dc=Object.keys(days).length;if(wc>=4)f=dc>1?'twiceweekly':'weekly';else if(wc===2)f='biweekly';else if(wc===1)f='monthly'}if(f==='weekly')return'Weekly';if(f==='twiceweekly'||f==='2xweekly')return'Twice Weekly';if(f==='biweekly'||f==='everyotherweek')return'Bi-Weekly';if(f==='monthly')return'Monthly';if(f==='onrequest'||f==='asneeded')return'On Request';return''}function fill(data){loaded=data;editToken=data.editToken;originalAddress=data.address||'';el('heading').textContent=data.displayName+' · '+data.customerId;['firstName','lastName','address','phone','email','calendarTitle','serviceStartDate','entryInformation','notes'].forEach(function(id){el(id).value=data[id]||''});el('frequency').value=editorFrequencyValue(data.frequency,data.routes);formatPmosPhoneInput(el('phone'));"
          if fill_old not in s:
              raise SystemExit('Customer Editor frequency fill target not found')
          s = s.replace(fill_old, fill_new, 1)
          event_old = "el('addBodyButton').onclick=function(){addWaterBody();prepareWaterBodyOptions(el('waterBodies'))};el('addContact').onclick=function(){addContact()};el('changeRoute').onclick=changeRoute;"
          event_new = "el('addBodyButton').onclick=function(){addWaterBody();prepareWaterBodyOptions(el('waterBodies'))};el('addContact').onclick=function(){addContact()};el('manualRouteToggle').onclick=function(){var panel=el('manualRoutePanel'),show=panel.style.display==='none';panel.style.display=show?'block':'none';this.textContent=show?'Hide manual route placement':'Select route placement manually';if(show)configureManualRoute()};el('changeRoute').onclick=changeRoute;"
          if event_old not in s:
              raise SystemExit('Customer Editor toggle binding target not found')
          p.write_text(s.replace(event_old, event_new, 1))
          PY
          git config user.name 'PMOS GitHub Actions'
          git config user.email 'maintenance.finnpools@gmail.com'
          git add 20-C_Add_Maintenance_Client_UI.gs 06-D_Temporary_Visit_UI_V3.gs 24-E_Customer_Editor.gs
          git commit -m 'Polish final customer and visit UI details'
          git push origin HEAD:pmos-development
