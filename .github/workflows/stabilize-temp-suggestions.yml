name: Stabilize Temporary Visit suggestions
on:
  push:
    branches: [pmos-development]
    paths: ['.github/workflows/stabilize-temp-suggestions.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
      - name: Keep final suggestions stable and reuse selected routing result
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('06-D_Temporary_Visit_UI_V3.gs')
          s=p.read_text()

          old="function loadDateSuggestions(){if(!selectedAddress)return;var token=++dateRequest,results=[],finished=0,errors=0,total=6;dateSuggestions.style.display='block';dateSuggestions.innerHTML='<b>Best upcoming dates</b><div class=\"muted\" style=\"margin-top:5px\">Searching 0 of '+total+' upcoming business days…</div>';function update(){if(token!==dateRequest)return;var ranked=results.slice().sort(function(a,b){if(Number(a.score||0)!==Number(b.score||0))return Number(b.score||0)-Number(a.score||0);if(Number(a.addedDurationMinutes||0)!==Number(b.addedDurationMinutes||0))return Number(a.addedDurationMinutes||0)-Number(b.addedDurationMinutes||0);return Number(a.addedDistanceKm||0)-Number(b.addedDistanceKm||0)}).slice(0,3);renderDates(ranked);var progress=document.createElement('div');progress.className='muted';progress.style.marginTop='7px';progress.textContent=finished<total?'Searching '+finished+' of '+total+' upcoming business days…':(errors?'Finished. '+errors+' day(s) could not be analyzed.':'Route suggestions ready.');dateSuggestions.appendChild(progress);if(ranked.length)addressMessage(finished<total?'Route suggestions are loading below…':'Route suggestions ready below.');else if(finished===total)addressMessage('No weekday route suggestions were available.',errors>0)}for(var offset=0;offset<total;offset++)(function(dayOffset){google.script.run.withSuccessHandler(function(result){if(token!==dateRequest)return;var recs=(result&&result.recommendations)||[];if(recs.length)results=results.concat(recs);finished++;update()}).withFailureHandler(function(){if(token!==dateRequest)return;errors++;finished++;update()}).recommendTemporaryVisitDates({address:address.value,addressVerified:true,addressDetails:selectedAddress,startOffsetWorkingDays:dayOffset,workdayCount:1,maxResults:1})})(offset)}"
          new="function loadDateSuggestions(){if(!selectedAddress)return;var token=++dateRequest,results=[],finished=0,errors=0,total=6;dateSuggestions.style.display='block';dateSuggestions.innerHTML='<b>Best upcoming dates</b><div id=\"routeSearchProgress\" class=\"muted\" style=\"margin-top:5px\">Searching 0 of '+total+' upcoming business days…</div>';function finishOne(){if(token!==dateRequest)return;finished++;var progress=document.getElementById('routeSearchProgress');if(progress)progress.textContent='Searching '+finished+' of '+total+' upcoming business days…';if(finished<total)return;var ranked=results.slice().sort(function(a,b){if(Number(a.score||0)!==Number(b.score||0))return Number(b.score||0)-Number(a.score||0);if(Number(a.addedDurationMinutes||0)!==Number(b.addedDurationMinutes||0))return Number(a.addedDurationMinutes||0)-Number(b.addedDurationMinutes||0);return Number(a.addedDistanceKm||0)-Number(b.addedDistanceKm||0)}).slice(0,3);renderDates(ranked);if(ranked.length)addressMessage('Route suggestions ready below.');else addressMessage('No weekday route suggestions were available.',errors>0)}for(var offset=0;offset<total;offset++)(function(dayOffset){google.script.run.withSuccessHandler(function(result){if(token!==dateRequest)return;var recs=(result&&result.recommendations)||[];if(recs.length)results=results.concat(recs);finishOne()}).withFailureHandler(function(){if(token!==dateRequest)return;errors++;finishOne()}).recommendTemporaryVisitDates({address:address.value,addressVerified:true,addressDetails:selectedAddress,startOffsetWorkingDays:dayOffset,workdayCount:1,maxResults:1})})(offset)}"
          if old not in s:
              raise SystemExit('progressive loadDateSuggestions target not found')
          s=s.replace(old,new,1)

          old="b.onclick=function(){Array.prototype.forEach.call(grid.querySelectorAll('.date-option'),function(x){x.classList.remove('selected')});b.classList.add('selected');selectSuggestedDate(r.date)};"
          new="b.onclick=function(){Array.prototype.forEach.call(grid.querySelectorAll('.date-option'),function(x){x.classList.remove('selected')});b.classList.add('selected');selectSuggestedDate(r)};"
          if old not in s:
              raise SystemExit('recommendation click target not found')
          s=s.replace(old,new,1)

          old="function selectSuggestedDate(date){var cards=visits.querySelectorAll('.visit-card'),target=null;for(var i=0;i<cards.length;i++){if(!cards[i].querySelector('.visit-date').value){target=cards[i];break}}if(!target)target=addVisitCard();target.querySelector('.visit-date').value=date;refreshPlacement(target)}"
          new="function applySuggestedPlacement(card,r){card.dataset.manual='false';card.querySelector('.visit-date').value=r.date;card.querySelector('.visit-stop').value=r.position;var rec=card.querySelector('.recommendation'),lines=[(r.dayName||'Route')+' · Stop '+r.position+' of '+(Number(r.customerCount||0)+1)];if(r.previousName||r.nextName)lines.push('Between: '+(r.previousName||'Route start')+' and '+(r.nextName||'Route end'));if(r.roadDataComplete){lines.push('Drive: '+fmtMinutes(r.routeDriveMinutes)+' · '+Number(r.routeDistanceKm||0).toFixed(1)+' km','Estimated route: '+fmtMinutes(r.estimatedRouteMinutes),'Added: +'+Number(r.addedDurationMinutes||0).toFixed(0)+' min · +'+Number(r.addedDistanceKm||0).toFixed(1)+' km')}if(r.reason)lines.push(r.reason);rec.textContent=lines.join('\\n');rec.className='recommendation '+(r.ratingClass||'good')}
function selectSuggestedDate(r){var cards=visits.querySelectorAll('.visit-card'),target=null;for(var i=0;i<cards.length;i++){if(!cards[i].querySelector('.visit-date').value){target=cards[i];break}}if(!target)target=addVisitCard();applySuggestedPlacement(target,r)}"
          if old not in s:
              raise SystemExit('selectSuggestedDate target not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          git config user.name 'PMOS GitHub Actions'
          git config user.email 'maintenance.finnpools@gmail.com'
          git add 06-D_Temporary_Visit_UI_V3.gs
          git commit -m 'Keep Temporary Visit best suggestions stable and reuse routing result'
          git push origin HEAD:pmos-development