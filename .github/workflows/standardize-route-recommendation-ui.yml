name: Standardize PMOS route recommendation UI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  standardize-route-ui:
    if: github.head_ref == 'pmos-development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
          fetch-depth: 0

      - name: Apply shared route-card component
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact target, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: regex target count {count}: {pattern[:140]!r}')
              p.write_text(new_text)

          # Add Maintenance Client: same shared CSS/script/card renderer.
          replace_once(
              '20-C_Add_Maintenance_Client_UI.gs',
              '</style></head><body>',
              '${pmosRouteRecommendationCardStyles_()}\n</style></head><body>'
          )
          replace_once(
              '20-C_Add_Maintenance_Client_UI.gs',
              '${pmosCustomerEquipmentEditorScript_()}\nfunction clearSuggestedStop',
              '${pmosCustomerEquipmentEditorScript_()}\n${pmosRouteRecommendationCardScript_()}\nfunction clearSuggestedStop'
          )
          replace_once(
              '20-C_Add_Maintenance_Client_UI.gs',
              '<div id="recommendations" class="recommendations"></div>',
              '<div id="recommendations" class="recommendations pmos-route-recommendations"></div>'
          )
          replace_once(
              '20-C_Add_Maintenance_Client_UI.gs',
              "b.className='rec';",
              "b.className='rec pmos-route-rec';"
          )
          regex_once(
              '20-C_Add_Maintenance_Client_UI.gs',
              r"\}\);var stop=Math\.max\(1,Math\.round\(Number\(r\.position\|\|primary\.position\|\|1\)\)\).*?;b\.innerHTML='<div class=\\\"rec-title\\\">.*?</ul>';box\.appendChild\(b\)\}\)\}",
              "});b.innerHTML=pmosRouteRecommendationHtml(r,i,{includeTemplate:true});box.appendChild(b)})}"
          )

          # Customer Editor route changes.
          replace_once(
              '24-E_Customer_Editor.gs',
              '${pmosCustomerEquipmentEditorStyles_()}\n</style>',
              '${pmosCustomerEquipmentEditorStyles_()}\n${pmosRouteRecommendationCardStyles_()}\n</style>'
          )
          replace_once(
              '24-E_Customer_Editor.gs',
              '${pmosCustomerEquipmentEditorScript_()}\nfunction setEquipmentField',
              '${pmosCustomerEquipmentEditorScript_()}\n${pmosRouteRecommendationCardScript_()}\nfunction setEquipmentField'
          )
          replace_once(
              '24-E_Customer_Editor.gs',
              '<div id="recommendations" class="recommendations"></div>',
              '<div id="recommendations" class="recommendations pmos-route-recommendations"></div>'
          )
          replace_once(
              '24-E_Customer_Editor.gs',
              "b.className='rec';",
              "b.className='rec pmos-route-rec';"
          )
          regex_once(
              '24-E_Customer_Editor.gs',
              r"b\.innerHTML='<div class=\\\"rec-title\\\">.*?</ul>';b\.onclick=function\(\)",
              "b.innerHTML=pmosRouteRecommendationHtml(r,i,{includeTemplate:true});b.onclick=function()"
          )

          # Temporary Visit upcoming-date insertion cards.
          replace_once(
              '06-D_Temporary_Visit_UI_V3.gs',
              '</style></head><body>',
              '${pmosRouteRecommendationCardStyles_()}\n</style></head><body>'
          )
          replace_once(
              '06-D_Temporary_Visit_UI_V3.gs',
              '<script>(function(){',
              '<script>\n${pmosRouteRecommendationCardScript_()}\n(function(){'
          )
          replace_once(
              '06-D_Temporary_Visit_UI_V3.gs',
              "grid.className='date-grid';",
              "grid.className='date-grid pmos-route-recommendations';"
          )
          replace_once(
              '06-D_Temporary_Visit_UI_V3.gs',
              "b.className='date-option';",
              "b.className='date-option pmos-route-rec';"
          )
          regex_once(
              '06-D_Temporary_Visit_UI_V3.gs',
              r"b\.innerHTML='<div class=\\\"rec-title\\\">.*?</ul>';b\.onclick=function\(\)",
              "b.innerHTML=pmosRouteRecommendationHtml(r,i,{title:r.displayDate,includeTemplate:false});b.onclick=function()"
          )
          PY

          python3 tools/check_apps_script_globals.py
          python3 tools/report_unused_apps_script_globals.py
          : > /tmp/pmos-combined.js
          while IFS= read -r -d '' file; do
            printf '\n// ---- %s ----\n' "$file" >> /tmp/pmos-combined.js
            cat "$file" >> /tmp/pmos-combined.js
            printf '\n' >> /tmp/pmos-combined.js
          done < <(find . -maxdepth 1 -type f -name '*.gs' -print0 | sort -z)
          node --check /tmp/pmos-combined.js

          rm -f .github/workflows/standardize-route-recommendation-ui.yml
          git config user.name 'PMOS GitHub Actions'
          git config user.email 'maintenance.finnpools@gmail.com'
          git add -A
          git commit -m 'Standardize route recommendation cards across PMOS'
          git push origin HEAD:pmos-development
