name: Remove Temporary Visit Service Location Header
on:
  push:
    branches: [pmos-development]
    paths:
      - '.github/workflows/remove-temp-service-location-header.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
      - name: Remove redundant header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('06-C_Temporary_Visit_UI_V2.gs')
          s=p.read_text()
          old='<div class="section">Service location</div>\n'
          if old not in s:
              raise SystemExit('Service location header not found')
          p.write_text(s.replace(old,'',1))
          PY
          git config user.name 'PMOS GitHub Actions'
          git config user.email 'maintenance.finnpools@gmail.com'
          git add 06-C_Temporary_Visit_UI_V2.gs
          git commit -m 'Remove redundant Temporary Visit service location header'
          git push origin HEAD:pmos-development
