name: Patch Add Maintenance Frequency Layout

on:
  push:
    branches: [pmos-development]
    paths:
      - '.github/pmos-frequency-layout.trigger'

permissions:
  contents: write

jobs:
  patch-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
      - name: Move Frequency beside Address
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('20-C_Add_Maintenance_Client_UI.gs')
          text = path.read_text()
          pattern = r'<label>Frequency<select id="frequency">.*?</select></label>'
          match = re.search(pattern, text, flags=re.S)
          if not match:
              raise SystemExit('Frequency control was not found.')
          frequency = match.group(0)
          text = text[:match.start()] + text[match.end():]

          old = '<label class="full">Service address'
          if old not in text:
              if '<label>Service address' in text and frequency in text.split('<div id="addressRouteStatus"', 1)[0]:
                  raise SystemExit(0)
              raise SystemExit('Service address control was not found.')
          text = text.replace(old, '<label>Service address', 1)

          anchor = '</label><div id="addressRouteStatus"'
          if anchor not in text:
              raise SystemExit('Address status anchor was not found.')
          text = text.replace(anchor, '</label>' + frequency + '<div id="addressRouteStatus"', 1)
          path.write_text(text)
          PY

          if git diff --quiet -- 20-C_Add_Maintenance_Client_UI.gs; then
            echo 'No layout change required.'
            exit 0
          fi
          git config user.name 'PMOS GitHub Actions'
          git config user.email 'maintenance.finnpools@gmail.com'
          git add 20-C_Add_Maintenance_Client_UI.gs
          git commit -m 'Place frequency beside service address'
          git push origin HEAD:pmos-development
