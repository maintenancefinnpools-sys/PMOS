name: Speed Temporary Visit suggestions
on:
  push:
    branches: [pmos-development]
    paths: ['.github/workflows/speed-temp-visit-suggestions.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
      - name: Make Temporary Visit date suggestions progressive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('06-D_Temporary_Visit_UI_V3.gs')
          s=p.read_text()
          old="function loadDateSuggestions(){if(!selectedAddress)return;var token=++dateRequest;dateSuggestions.style.display='block';dateSuggestions.innerHTML='<b>Best upcoming dates</b><div class=\"muted\" style=\"margin-top:5px\">Comparing upcoming weekday routes…</div>';google.script.run.withSuccessHandler(function(result){if(token!==dateRequest)return;renderDates((result&&result.recommendations)||[]);addressMessage('Route suggestions ready below.')}).withFailureHandler(function(e){if(token!==dateRequest)return;dateSuggestions.innerHTML='<b>Best upcoming dates</b><div class=\"muted\" style=\"margin-top:5px\">'+(e&&e.message?e.message:String(e))+'</div>';addressMessage('Address confirmed, but route suggestions could not load.',true)}).recommendTemporaryVisitDates({address:address.value,addressVerified:true,addressDetails:selectedAddress,startOffsetWorkingDays:0,workdayCount:6,maxResults:3})}"
          new="function loadDateSuggestions(){if(!selectedAddress)return;var token=++dateRequest,results=[],finished=0,errors=0,total=6;dateSuggestions.style.display='block';dateSuggestions.innerHTML='<b>Best upcoming dates</b><div class=\"muted\" style=\"margin-top:5px\">Searching 0 of '+total+' upcoming business days…</div>';function update(){if(token!==dateRequest)return;var ranked=results.slice().sort(function(a,b){if(Number(a.score||0)!==Number(b.score||0))return Number(b.score||0)-Number(a.score||0);if(Number(a.addedDurationMinutes||0)!==Number(b.addedDurationMinutes||0))return Number(a.addedDurationMinutes||0)-Number(b.addedDurationMinutes||0);return Number(a.addedDistanceKm||0)-Number(b.addedDistanceKm||0)}).slice(0,3);renderDates(ranked);var progress=document.createElement('div');progress.className='muted';progress.style.marginTop='7px';progress.textContent=finished<total?'Searching '+finished+' of '+total+' upcoming business days…':(errors?'Finished. '+errors+' day(s) could not be analyzed.':'Route suggestions ready.');dateSuggestions.appendChild(progress);if(ranked.length)addressMessage(finished<total?'Route suggestions are loading below…':'Route suggestions ready below.');else if(finished===total)addressMessage('No weekday route suggestions were available.',errors>0)}for(var offset=0;offset<total;offset++)(function(dayOffset){google.script.run.withSuccessHandler(function(result){if(token!==dateRequest)return;var recs=(result&&result.recommendations)||[];if(recs.length)results=results.concat(recs);finished++;update()}).withFailureHandler(function(){if(token!==dateRequest)return;errors++;finished++;update()}).recommendTemporaryVisitDates({address:address.value,addressVerified:true,addressDetails:selectedAddress,startOffsetWorkingDays:dayOffset,workdayCount:1,maxResults:1})})(offset)}"
          if old not in s:
              raise SystemExit('V3 loadDateSuggestions target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'PMOS GitHub Actions'
          git config user.email 'maintenance.finnpools@gmail.com'
          git add 06-D_Temporary_Visit_UI_V3.gs
          git commit -m 'Load Temporary Visit route suggestions progressively'
          git push origin HEAD:pmos-development