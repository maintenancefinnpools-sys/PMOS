name: Consolidate customer account code

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  consolidate:
    if: github.head_ref == 'pmos-development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
          fetch-depth: 0

      - name: Consolidate compatibility modules into existing Apps Script files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          groups = {
              '20-E_Add_Maintenance_Customer_Transaction.gs': [
                  '20-F_Add_Maintenance_Customer_Account_Compatibility.gs',
              ],
              '24-A_Customer_Profile_UI.gs': [
                  '24-I_Customer_Account_Service_Locations.gs',
                  '24-K_Customer_Account_Service_Locations_UI.gs',
                  '24-L_Customer_Profile_Account_Integration.gs',
                  '24-N_Customer_Account_Terminology.gs',
              ],
              '24-E_Customer_Editor.gs': [
                  '24-J_Customer_Account_Editor_Compatibility.gs',
                  '24-M_Customer_Account_Shared_Fields.gs',
              ],
              '24-F_Customer_Equipment_Editor_Component.gs': [
                  '24-G_Customer_Equipment_Model_Enhancements.gs',
                  '24-H_Customer_Equipment_Catalog_Fixes.gs',
              ],
          }

          for target_name, source_names in groups.items():
              target = Path(target_name)
              text = target.read_text()
              marker = '/* PMOS_CONSOLIDATED_ACCOUNT_MODULES */'
              if marker in text:
                  continue
              additions = []
              for source_name in source_names:
                  source = Path(source_name)
                  if not source.exists():
                      raise SystemExit(f'Missing consolidation source: {source_name}')
                  additions.append(f'\n\n/* Consolidated from {source_name}. */\n' + source.read_text().rstrip() + '\n')
              target.write_text(text.rstrip() + '\n\n' + marker + ''.join(additions))

          for source_names in groups.values():
              for source_name in source_names:
                  Path(source_name).unlink(missing_ok=True)
          PY

      - name: Run PMOS static checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_apps_script_globals.py
          python3 tools/report_unused_apps_script_globals.py
          : > /tmp/pmos-combined.js
          while IFS= read -r -d '' file; do
            printf '\n// ---- %s ----\n' "$file" >> /tmp/pmos-combined.js
            cat "$file" >> /tmp/pmos-combined.js
            printf '\n' >> /tmp/pmos-combined.js
          done < <(find . -maxdepth 1 -type f -name '*.gs' -print0 | sort -z)
          node --check /tmp/pmos-combined.js

      - name: Publish consolidated build
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/consolidate-customer-account-files.yml
          git config user.name 'PMOS GitHub Actions'
          git config user.email 'maintenance.finnpools@gmail.com'
          git add -A
          git commit -m 'Consolidate customer account features for Apps Script pull'
          git push origin HEAD:pmos-development
