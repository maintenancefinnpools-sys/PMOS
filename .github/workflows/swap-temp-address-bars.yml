name: Swap Temporary Visit address bars
on:
  push:
    branches: [pmos-development]
    paths: ['.github/workflows/swap-temp-address-bars.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
      - name: Put confirmed address above route-search status
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('06-D_Temporary_Visit_UI_V3.gs')
          s=p.read_text()
          old='<label class="full">Service address<div class="address-wrap"><input id="address" autocomplete="off" placeholder="Begin typing address"><div id="addressList" class="address-list"></div></div></label><div id="addressStatus" class="address-status"></div><div id="addressDetails" class="address-details"></div>'
          new='<label class="full">Service address<div class="address-wrap"><input id="address" autocomplete="off" placeholder="Begin typing address"><div id="addressList" class="address-list"></div></div></label><div id="addressDetails" class="address-details"></div><div id="addressStatus" class="address-status"></div>'
          if old not in s:
              raise SystemExit('Expected address status markup not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 06-D_Temporary_Visit_UI_V3.gs
          git commit -m 'Place confirmed address above Temporary Visit route status'
          git push origin HEAD:pmos-development
