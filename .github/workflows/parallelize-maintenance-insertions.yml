name: Parallelize maintenance insertion suggestions
on:
  push:
    branches: [pmos-development]
    paths: ['.github/workflows/parallelize-maintenance-insertions.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
      - name: Parallelize recurring-customer insertion searches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('20_Add_Maintenance_Client.gs')
          s=p.read_text()
          old="""  const scored = candidates
    .map(function (candidate) {
      return scoreMaintenanceRotationCandidate_(routes, resolvePoint, target, candidate);
    })
    .filter(Boolean);"""
          new="""  const candidateStart = Math.max(0, Number(input.candidateStart || 0));
  const candidateCount = input.candidateCount == null
    ? candidates.length
    : Math.max(1, Number(input.candidateCount || 1));
  const candidatesToScore = candidates.slice(candidateStart, candidateStart + candidateCount);
  const scored = candidatesToScore
    .map(function (candidate) {
      return scoreMaintenanceRotationCandidate_(routes, resolvePoint, target, candidate);
    })
    .filter(Boolean);"""
          if old not in s: raise SystemExit('backend target not found')
          p.write_text(s.replace(old,new,1))

          p=Path('20-C_Add_Maintenance_Client_UI.gs')
          s=p.read_text()
          old="function loadRecommendations(){var data=formValues();selectedPlacements=[];if(!selectedAddress){currentRecommendations=[];byId('recommendations').innerHTML='';byId('recommendationStatus').textContent='Choose a complete address suggestion before calculating route placement.';setAddressRouteStatus('',false);return}var request=++recRequest;setAddressRouteStatus('Searching for the best route insertions…',false);byId('recommendationStatus').textContent='Calculating GPS placement in the existing PMOS route layers…';google.script.run.withSuccessHandler(function(result){if(request!==recRequest)return;currentRecommendations=(result&&result.recommendations)||[];setAddressRouteStatus(currentRecommendations.length?'Best route insertions are ready below.':'Route search finished; no automatic placement was available.',!currentRecommendations.length);byId('recommendationStatus').textContent=(result&&result.qualityMessage)||'Recommendations calculated.';renderRecommendations()}).withFailureHandler(function(error){if(request!==recRequest)return;currentRecommendations=[];byId('recommendations').innerHTML='';setAddressRouteStatus('Route insertion search could not be completed. You can continue filling the form and retry below.',true);byId('recommendationStatus').textContent='Route recommendations could not be calculated.\\n'+(error&&error.message?error.message:String(error))}).recommendMaintenanceClientRotations(data)}"
          new="function maintenanceCandidateCount(frequency){var f=String(frequency||'').toLowerCase();return f.indexOf('monthly')>=0?20:f.indexOf('bi')>=0?10:f.indexOf('twice')>=0?10:5}function compareMaintenanceClientResults(a,b){if(!!a.roadDataComplete!==!!b.roadDataComplete)return a.roadDataComplete?-1:1;var ad=a.addedDurationMinutes==null?1e9:Number(a.addedDurationMinutes),bd=b.addedDurationMinutes==null?1e9:Number(b.addedDurationMinutes);return ad-bd||Number(a.addedDistanceKm||0)-Number(b.addedDistanceKm||0)||Number(b.score||0)-Number(a.score||0)}function loadRecommendations(){var data=formValues();selectedPlacements=[];if(!selectedAddress){currentRecommendations=[];byId('recommendations').innerHTML='';byId('recommendationStatus').textContent='Choose a complete address suggestion before calculating route placement.';setAddressRouteStatus('',false);return}var request=++recRequest,totalCandidates=maintenanceCandidateCount(data.frequency),shards=5,chunk=Math.ceil(totalCandidates/shards),finished=0,errors=0,combined=[];setAddressRouteStatus('Searching for the best route insertions…',false);byId('recommendationStatus').textContent='Comparing 0 of '+shards+' route-search groups…';function finishOne(){if(request!==recRequest)return;finished++;byId('recommendationStatus').textContent='Comparing '+finished+' of '+shards+' route-search groups…';if(finished<shards)return;currentRecommendations=combined.sort(compareMaintenanceClientResults).slice(0,3);setAddressRouteStatus(currentRecommendations.length?'Best route insertions are ready below.':'Route search finished; no automatic placement was available.',!currentRecommendations.length);byId('recommendationStatus').textContent=currentRecommendations.length?(errors?'Best available placements calculated; '+errors+' search group(s) could not be completed.':'Best placements calculated by the PMOS Route Intelligence Engine.'):'No usable route placements were found. Manual placement remains available.';renderRecommendations()}for(var shard=0;shard<shards;shard++)(function(index){var start=index*chunk;if(start>=totalCandidates){finishOne();return}var requestData=Object.assign({},data,{candidateStart:start,candidateCount:Math.min(chunk,totalCandidates-start),maxResults:3});google.script.run.withSuccessHandler(function(result){if(request!==recRequest)return;combined=combined.concat((result&&result.recommendations)||[]);finishOne()}).withFailureHandler(function(){if(request!==recRequest)return;errors++;finishOne()}).recommendMaintenanceClientRotations(requestData)})(shard)}"
          if old not in s: raise SystemExit('add maintenance UI target not found')
          p.write_text(s.replace(old,new,1))

          p=Path('24-E_Customer_Editor.gs')
          s=p.read_text()
          old="function loadRoutes(){el('routeBox').style.display='block';el('routeMessage').textContent='Address confirmed. Calculating the best route placements…';el('recommendations').innerHTML='';google.script.run.withSuccessHandler(renderRoutes).withFailureHandler(function(e){el('routeMessage').textContent=e&&e.message?e.message:String(e)}).recommendMaintenanceClientRotations({address:el('address').value,addressVerified:true,addressDetails:selectedAddress,frequency:el('frequency').value||'Weekly',excludeCustomerId:customerId})}"
          new="function editorMaintenanceCandidateCount(frequency){var f=String(frequency||'').toLowerCase();return f.indexOf('monthly')>=0?20:f.indexOf('bi')>=0?10:f.indexOf('twice')>=0?10:5}function compareEditorRouteResults(a,b){if(!!a.roadDataComplete!==!!b.roadDataComplete)return a.roadDataComplete?-1:1;var ad=a.addedDurationMinutes==null?1e9:Number(a.addedDurationMinutes),bd=b.addedDurationMinutes==null?1e9:Number(b.addedDurationMinutes);return ad-bd||Number(a.addedDistanceKm||0)-Number(b.addedDistanceKm||0)||Number(b.score||0)-Number(a.score||0)}function loadRoutes(){el('routeBox').style.display='block';el('recommendations').innerHTML='';var frequency=el('frequency').value||'Weekly',totalCandidates=editorMaintenanceCandidateCount(frequency),shards=5,chunk=Math.ceil(totalCandidates/shards),finished=0,errors=0,combined=[];el('routeMessage').textContent='Comparing 0 of '+shards+' route-search groups…';function finishOne(){finished++;el('routeMessage').textContent='Comparing '+finished+' of '+shards+' route-search groups…';if(finished<shards)return;combined.sort(compareEditorRouteResults);renderRoutes({recommendations:combined.slice(0,3),qualityMessage:combined.length?(errors?'Best available alternate placements calculated; '+errors+' search group(s) could not be completed.':'Best alternate placements calculated by the PMOS Route Intelligence Engine.'):'No usable alternate route placements were found.'})}for(var shard=0;shard<shards;shard++)(function(index){var start=index*chunk;if(start>=totalCandidates){finishOne();return}google.script.run.withSuccessHandler(function(result){combined=combined.concat((result&&result.recommendations)||[]);finishOne()}).withFailureHandler(function(){errors++;finishOne()}).recommendMaintenanceClientRotations({address:el('address').value,addressVerified:true,addressDetails:selectedAddress,frequency:frequency,excludeCustomerId:customerId,candidateStart:start,candidateCount:Math.min(chunk,totalCandidates-start),maxResults:3})})(shard)}"
          if old not in s: raise SystemExit('customer editor UI target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'PMOS GitHub Actions'
          git config user.email 'maintenance.finnpools@gmail.com'
          git add 20_Add_Maintenance_Client.gs 20-C_Add_Maintenance_Client_UI.gs 24-E_Customer_Editor.gs
          git commit -m 'Parallelize maintenance route insertion suggestions'
          git push origin HEAD:pmos-development
# trigger
