name: Finish PMOS multi-location support from PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finish-multilocation:
    if: github.head_ref == 'pmos-development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
          fetch-depth: 0

      - name: Apply compatibility patch and validate
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/finish-multilocation-payload.b64 | gzip -d > /tmp/finish_multilocation.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/finish_multilocation.py')
          s = p.read_text()
          old = '''replace_once(
              '03_Route_Manager.gs',
              "  const idCol = headers.indexOf('Customer ID');",
              "  const idCol = headers.indexOf('Customer ID');\\n  const serviceLocationCol = headers.indexOf('Service Location ID');"
          )'''
          new = '''replace_once(
              '03_Route_Manager.gs',
              "  const mapLabelCol = headers.indexOf('Map Label');\\n  const titleCol = headers.indexOf('Calendar Title');\\n  const idCol = headers.indexOf('Customer ID');",
              "  const mapLabelCol = headers.indexOf('Map Label');\\n  const titleCol = headers.indexOf('Calendar Title');\\n  const idCol = headers.indexOf('Customer ID');\\n  const serviceLocationCol = headers.indexOf('Service Location ID');"
          )'''
          if old not in s:
              raise SystemExit('Could not locate Route Manager patch correction target.')
          s = s.replace(old, new, 1)
          s = s.replace(
              "raise SystemExit(f'{path}: expected one target, found {text.count(old)}')",
              "raise SystemExit(f'{path}: expected one target, found {text.count(old)}; target={old[:260]!r}')",
              1
          )
          p.write_text(s)
          PY
          python3 /tmp/finish_multilocation.py
          python3 tools/check_apps_script_globals.py
          python3 tools/report_unused_apps_script_globals.py
          : > /tmp/pmos-combined.js
          while IFS= read -r -d '' file; do
            printf '\n// ---- %s ----\n' "$file" >> /tmp/pmos-combined.js
            cat "$file" >> /tmp/pmos-combined.js
            printf '\n' >> /tmp/pmos-combined.js
          done < <(find . -maxdepth 1 -type f -name '*.gs' -print0 | sort -z)
          node --check /tmp/pmos-combined.js

          rm -rf .github/multiloc-patches
          rm -f .github/multiloc-ready .github/finish-multilocation-error.txt \
            .github/finish-multilocation.trigger .github/finish-multilocation-payload*.b64 \
            .github/finish-multilocation-pr.trigger* \
            .github/workflows/finish-multilocation.yml \
            .github/workflows/finish-multilocation-pr.yml
          git config user.name 'PMOS GitHub Actions'
          git config user.email 'maintenance.finnpools@gmail.com'
          git add -A
          git commit -m 'Complete multi-location customer support'
          git push origin HEAD:pmos-development
