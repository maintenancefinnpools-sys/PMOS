name: Fix Temporary Visit placement date shape
on:
  push:
    branches: [pmos-development]
    paths: ['.github/workflows/fix-temp-placement-date-shape.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
      - name: Fix placement request shape and backend compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['06-C_Temporary_Visit_UI_V2.gs','06-D_Temporary_Visit_UI_V3.gs']:
              p=Path(name); s=p.read_text()
              old="suggestTemporaryVisitPlacement({address:address.value,addressVerified:true,addressDetails:selectedAddress,date:d})"
              new="suggestTemporaryVisitPlacement({address:address.value,addressVerified:true,addressDetails:selectedAddress,dates:[d],date:d})"
              if old not in s:
                  raise SystemExit(f'placement caller not found in {name}')
              p.write_text(s.replace(old,new,1))
          p=Path('06-A_Temporary_Visit_Recommendations.gs'); s=p.read_text()
          old="  const dates = Array.isArray(payload.dates) ? payload.dates.filter(Boolean) : [];\n  if (!dates.length) throw new Error('Choose at least one visit date.');"
          new="  const dates = Array.isArray(payload.dates) ? payload.dates.filter(Boolean) : (payload.date ? [payload.date] : []);\n  if (!dates.length) throw new Error('Choose at least one visit date.');"
          if old not in s:
              raise SystemExit('backend date parser not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'PMOS GitHub Actions'
          git config user.email 'maintenance.finnpools@gmail.com'
          git add 06-A_Temporary_Visit_Recommendations.gs 06-C_Temporary_Visit_UI_V2.gs 06-D_Temporary_Visit_UI_V3.gs
          git commit -m 'Fix Temporary Visit GPS placement date request'
          git push origin HEAD:pmos-development
