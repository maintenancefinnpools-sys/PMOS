name: Finish PMOS multi-location support
on:
  push:
    branches: [pmos-development]
    paths: ['.github/finish-multilocation.trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
      - name: Apply multi-location compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/finish_multilocation.py
          python3 /tmp/finish_multilocation.py
      - name: Run PMOS static checks before push
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_apps_script_globals.py
          python3 tools/report_unused_apps_script_globals.py
          : > /tmp/pmos-combined.js
          while IFS= read -r -d '' file; do
            printf '\n// ---- %s ----\n' "$file" >> /tmp/pmos-combined.js
            cat "$file" >> /tmp/pmos-combined.js
            printf '\n' >> /tmp/pmos-combined.js
          done < <(find . -maxdepth 1 -type f -name '*.gs' -print0 | sort -z)
          node --check /tmp/pmos-combined.js
      - name: Commit finished product and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/finish-multilocation.trigger .github/workflows/finish-multilocation.yml
          git config user.name 'PMOS GitHub Actions'
          git config user.email 'maintenance.finnpools@gmail.com'
          git add -A
          git commit -m 'Complete multi-location customer support'
          git push origin HEAD:pmos-development
