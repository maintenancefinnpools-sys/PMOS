name: Reuse Temporary Visit suggestion result
on:
  push:
    branches: [pmos-development]
    paths: ['.github/workflows/reuse-temp-suggestion-result.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
      - name: Reuse selected suggestion without recalculating GPS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('06-D_Temporary_Visit_UI_V3.gs')
          s=p.read_text()
          old="b.onclick=function(){Array.prototype.forEach.call(grid.querySelectorAll('.date-option'),function(x){x.classList.remove('selected')});b.classList.add('selected');selectSuggestedDate(r.date)};"
          new="b.onclick=function(){Array.prototype.forEach.call(grid.querySelectorAll('.date-option'),function(x){x.classList.remove('selected')});b.classList.add('selected');selectSuggestedDate(r)};"
          if old not in s:
              raise SystemExit('suggestion click target not found')
          s=s.replace(old,new,1)
          old="function selectSuggestedDate(date){var cards=visits.querySelectorAll('.visit-card'),target=null;for(var i=0;i<cards.length;i++){if(!cards[i].querySelector('.visit-date').value){target=cards[i];break}}if(!target)target=addVisitCard();target.querySelector('.visit-date').value=date;refreshPlacement(target)}"
          new="function selectSuggestedDate(r){var cards=visits.querySelectorAll('.visit-card'),target=null;for(var i=0;i<cards.length;i++){if(!cards[i].querySelector('.visit-date').value){target=cards[i];break}}if(!target)target=addVisitCard();target.dataset.manual='false';target.querySelector('.visit-date').value=r.date;target.querySelector('.visit-stop').value=r.position;var rec=target.querySelector('.recommendation'),lines=[(r.dayName||'Route')+' · Stop '+r.position+' of '+(Number(r.customerCount||0)+1)];if(r.previousName||r.nextName)lines.push('Between: '+(r.previousName||'Route start')+' and '+(r.nextName||'Route end'));if(r.roadDataComplete){lines.push('Drive: '+fmtMinutes(r.routeDriveMinutes)+' · '+Number(r.routeDistanceKm||0).toFixed(1)+' km','Estimated route: '+fmtMinutes(r.estimatedRouteMinutes),'Added: +'+Number(r.addedDurationMinutes||0).toFixed(0)+' min · +'+Number(r.addedDistanceKm||0).toFixed(1)+' km')}if(r.reason)lines.push(r.reason);rec.textContent=lines.join('\\n');rec.className='recommendation '+(r.ratingClass||'good')}"
          if old not in s:
              raise SystemExit('selectSuggestedDate target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'PMOS GitHub Actions'
          git config user.email 'maintenancefinnpools@gmail.com'
          git add 06-D_Temporary_Visit_UI_V3.gs
          git commit -m 'Reuse Temporary Visit suggestion routing result'
          git push origin HEAD:pmos-development
# trigger
