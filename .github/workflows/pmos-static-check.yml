name: PMOS Static Check

on:
  push:
    branches:
      - pmos-development
      - main
  pull_request:

jobs:
  apps-script-static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Apps Script global namespace
        run: python3 tools/check_apps_script_globals.py

      - name: Report self-only global candidates
        run: python3 tools/report_unused_apps_script_globals.py

      - name: Check combined Apps Script syntax
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/pmos-combined.js
          while IFS= read -r -d '' file; do
            printf '\n// ---- %s ----\n' "$file" >> /tmp/pmos-combined.js
            cat "$file" >> /tmp/pmos-combined.js
            printf '\n' >> /tmp/pmos-combined.js
          done < <(find . -maxdepth 1 -type f -name '*.gs' -print0 | sort -z)
          node --check /tmp/pmos-combined.js

      - name: Check Web App client JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          paths = sorted(Path('.').glob('Web_*.html'))
          client = Path('Client.html')
          if client.exists():
              paths.append(client)

          checked = 0
          for path in paths:
              text = path.read_text(encoding='utf-8')
              scripts = re.findall(r'<script\b[^>]*>(.*?)</script>', text, flags=re.IGNORECASE | re.DOTALL)
              scripts = [script for script in scripts if '<?' not in script]
              if not scripts:
                  continue
              target = Path('/tmp') / ('pmos-web-' + re.sub(r'[^A-Za-z0-9_.-]+', '-', path.name) + '.js')
              target.write_text('\n\n'.join(scripts), encoding='utf-8')
              subprocess.run(['node', '--check', str(target)], check=True)
              print('checked', path)
              checked += 1

          if not checked:
              raise SystemExit('No Web App client scripts were found to validate.')
          PY

      - name: Check Web App Apps Script endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gs_text = '\n'.join(path.read_text(encoding='utf-8') for path in sorted(Path('.').glob('*.gs')))
          declared = set(re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(', gs_text))

          paths = sorted(Path('.').glob('Web_*.html'))
          client = Path('Client.html')
          if client.exists():
              paths.append(client)

          calls = {}
          pattern = re.compile(r'\b(?:call|server)\s*\(\s*[\'\"]([A-Za-z_$][\w$]*)[\'\"]')
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for name in pattern.findall(text):
                  calls.setdefault(name, set()).add(path.name)

          missing = {name: files for name, files in calls.items() if name not in declared}
          if missing:
              for name in sorted(missing):
                  print(f'Missing Apps Script endpoint {name}: {", ".join(sorted(missing[name]))}')
              raise SystemExit(f'{len(missing)} Web App Apps Script endpoint(s) are missing.')

          print(f'validated {len(calls)} Web App Apps Script endpoint(s)')
          PY
