name: Patch Temporary Visit recommendation cards
on:
  push:
    branches: [pmos-development]
    paths: ['.github/workflows/patch-temp-recommendation-cards.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
      - name: Match Add Maintenance Client recommendation cards
        shell: python
        run: |
          from pathlib import Path
          p=Path('06-D_Temporary_Visit_UI_V3.gs')
          s=p.read_text()
          old_css=".date-suggestions{display:none;grid-column:1/-1;border:1px solid #dbeafe;border-radius:10px;background:#fff;padding:12px}.date-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.date-option{width:100%;min-height:125px;text-align:left;background:#fff;border:2px solid #dbeafe;padding:10px;border-radius:9px;cursor:pointer}.date-option:hover{background:#eff6ff;border-color:#60a5fa}.date-meta{font-size:11px;color:#475569;line-height:1.4;margin-top:4px}"
          new_css=".date-suggestions{display:none;grid-column:1/-1}.date-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}.date-option{width:100%;padding:11px;text-align:left;background:#fff;border:2px solid #dbeafe;border-radius:10px;cursor:pointer}.date-option:hover{background:#eff6ff}.date-option.selected{border-color:#2563eb;background:#eff6ff}.rec-title{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}.rec-points{margin:7px 0 0;padding-left:16px;color:#475569;font-size:11px;line-height:1.35}.rec-points li{margin:2px 0}.date-meta{font-size:11px;color:#475569;line-height:1.4;margin-top:4px}"
          if old_css not in s: raise SystemExit('Expected Temporary Visit card CSS not found')
          s=s.replace(old_css,new_css,1)
          old="function renderDates(items){dateSuggestions.innerHTML='<b>Best upcoming dates</b>';if(!items.length){dateSuggestions.innerHTML+='<div class=\"muted\" style=\"margin-top:5px\">No weekday route recommendations were available.</div>';return}var grid=document.createElement('div');grid.className='date-grid';grid.style.marginTop='9px';items.forEach(function(r,i){var b=document.createElement('button');b.type='button';b.className='date-option';b.innerHTML='<b>'+(i+1)+'. '+r.displayDate+'</b><div class=\"date-meta\"><b>'+r.rating+'</b> · Week '+r.rotationWeek+'</div><div class=\"date-meta\">Stop '+r.position+' of '+(Number(r.customerCount||0)+1)+'</div><div class=\"date-meta\">'+(r.roadDataComplete?('Added: +'+Math.round(r.addedDurationMinutes)+' min · +'+Number(r.addedDistanceKm||0).toFixed(1)+' km'):r.reason)+'</div>';b.onclick=function(){selectSuggestedDate(r.date)};grid.appendChild(b)});dateSuggestions.appendChild(grid)}"
          new="function renderDates(items){dateSuggestions.innerHTML='<b>Best upcoming dates</b>';if(!items.length){dateSuggestions.innerHTML+='<div class=\"muted\" style=\"margin-top:5px\">No weekday route recommendations were available.</div>';return}var grid=document.createElement('div');grid.className='date-grid';items.forEach(function(r,i){var b=document.createElement('button');b.type='button';b.className='date-option';var points=['<li><b>Rotation week:</b> Week '+esc(r.rotationWeek)+'</li>','<li><b>Stop position:</b> '+esc(r.position)+' of '+esc(Number(r.customerCount||0)+1)+'</li>'];if(r.previousName)points.push('<li><b>After:</b> '+esc(r.previousName)+'</li>');if(r.nextName)points.push('<li><b>Before:</b> '+esc(r.nextName)+'</li>');if(r.roadDataComplete){points.push('<li><b>Drive:</b> '+esc(fmtMinutes(r.routeDriveMinutes))+' · '+Number(r.routeDistanceKm||0).toFixed(1)+' km</li>','<li><b>Stops:</b> '+esc(Number(r.customerCount||0)+1)+'</li>','<li><b>Estimated route*:</b> '+esc(fmtMinutes(r.estimatedRouteMinutes))+'</li>','<li><b>Added:</b> +'+Number(r.addedDurationMinutes||0).toFixed(0)+' min · +'+Number(r.addedDistanceKm||0).toFixed(1)+' km</li>','<li class=\"muted\">*'+esc(r.routeProvider||'RIE')+' routing</li>')}else points.push('<li>'+esc(r.reason||'GPS road-time check unavailable. Review placement.')+'</li>');b.innerHTML='<div class=\"rec-title\"><span>'+(i+1)+'. '+esc(r.displayDate)+'</span><span>'+esc(r.rating)+'</span></div><ul class=\"rec-points\">'+points.join('')+'</ul>';b.onclick=function(){Array.prototype.forEach.call(grid.querySelectorAll('.date-option'),function(x){x.classList.remove('selected')});b.classList.add('selected');selectSuggestedDate(r.date)};grid.appendChild(b)});dateSuggestions.appendChild(grid)}"
          if old not in s: raise SystemExit('Expected renderDates function not found')
          s=s.replace(old,new,1)
          marker="function selectSuggestedDate(date){"
          helpers="function fmtMinutes(v){var n=Math.max(0,Math.round(Number(v)||0)),h=Math.floor(n/60),m=n%60;return h?h+'h '+m+'m':m+' min'}\nfunction esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;')}\n"
          if marker not in s: raise SystemExit('Expected helper insertion marker not found')
          s=s.replace(marker,helpers+marker,1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 06-D_Temporary_Visit_UI_V3.gs
          git diff --cached --quiet && exit 0
          git commit -m 'Match Temporary Visit recommendation cards to maintenance client'
          git push origin HEAD:pmos-development