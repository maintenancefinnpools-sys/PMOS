name: Fix Temporary Visit payload compatibility
on:
  push:
    branches: [pmos-development]
    paths: ['.github/workflows/fix-temp-visit-payload.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmos-development
      - name: Fix V3 to V2 scheduler payload contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui=Path('06-D_Temporary_Visit_UI_V3.gs')
          s=ui.read_text()
          old="function payload(){var rows=[];Array.prototype.forEach.call(visits.querySelectorAll('.visit-card'),function(c){var d=c.querySelector('.visit-date').value;if(d)rows.push({date:d,stopPosition:Number(c.querySelector('.visit-stop').value||1)})});var title=(visits.querySelector('.calendar-title')||{}).value||lastName.value;return{title:String(title||'').trim(),calendarTitle:String(title||'').trim(),firstName:firstName.value.trim(),lastName:lastName.value.trim(),fullName:[firstName.value.trim(),lastName.value.trim()].filter(Boolean).join(' '),address:address.value.trim(),addressVerified:!!selectedAddress,addressDetails:selectedAddress,phone:phone.value.trim(),email:email.value.trim(),entryInformation:entry.value.trim(),customerNotes:notes.value.trim(),visits:rows}}"
          new="function payload(){var rows=[];Array.prototype.forEach.call(visits.querySelectorAll('.visit-card'),function(c){var d=String(c.querySelector('.visit-date').value||'').trim();if(d)rows.push({date:d,stopPosition:Number(c.querySelector('.visit-stop').value||1)})});var title=(visits.querySelector('.calendar-title')||{}).value||lastName.value;return{title:String(title||'').trim(),calendarTitle:String(title||'').trim(),firstName:firstName.value.trim(),lastName:lastName.value.trim(),fullName:[firstName.value.trim(),lastName.value.trim()].filter(Boolean).join(' '),address:address.value.trim(),addressVerified:!!selectedAddress,addressDetails:selectedAddress,phone:phone.value.trim(),email:email.value.trim(),entryInformation:entry.value.trim(),customerNotes:notes.value.trim(),visits:rows,dates:rows.map(function(v){return v.date}),stopPositions:rows.map(function(v){return v.stopPosition})}}"
          if old not in s:
              raise SystemExit('V3 payload function not found')
          ui.write_text(s.replace(old,new,1))

          server=Path('06-C_Temporary_Visit_UI_V2.gs')
          s=server.read_text()
          old="  const requests = (Array.isArray(payload.visits) ? payload.visits : []).map(function(item) {\n    return {date: String(item.date || '').trim(), stopPosition: Math.max(1, Math.floor(Number(item.stopPosition || 1)))};\n  }).filter(function(item) { return item.date; });"
          new="  let requests = (Array.isArray(payload.visits) ? payload.visits : []).map(function(item) {\n    return {date: String(item.date || '').trim(), stopPosition: Math.max(1, Math.floor(Number(item.stopPosition || 1)))};\n  }).filter(function(item) { return item.date; });\n  if (!requests.length && Array.isArray(payload.dates)) {\n    const stops = Array.isArray(payload.stopPositions) ? payload.stopPositions : [];\n    requests = payload.dates.map(function(date, index) {\n      return {date: String(date || '').trim(), stopPosition: Math.max(1, Math.floor(Number(stops[index] || 1)))};\n    }).filter(function(item) { return item.date; });\n  }"
          if old not in s:
              raise SystemExit('V2 scheduler request parser not found')
          server.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 06-D_Temporary_Visit_UI_V3.gs 06-C_Temporary_Visit_UI_V2.gs
          git commit -m 'Fix Temporary Visit date payload compatibility'
          git push origin HEAD:pmos-development
