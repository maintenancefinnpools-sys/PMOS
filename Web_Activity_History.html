<style>
.ah-layout{display:grid;gap:14px;max-width:1120px}.ah-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px}.ah-filter{padding:8px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font-size:11px;font-weight:900;cursor:pointer}.ah-filter.active{border-color:var(--brand);background:#e7f3f8;color:var(--brand-dark)}.ah-search{margin-left:auto;min-width:220px;min-height:36px;border:1px solid var(--border);border-radius:8px;background:#fff;padding:7px 10px;color:var(--text);font:inherit}.ah-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.ah-metric{padding:12px;border:1px solid var(--border);border-left:4px solid var(--brand);border-radius:9px;background:#fff}.ah-metric span{display:block;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.ah-metric strong{display:block;margin-top:4px;font-size:18px;color:var(--brand-dark)}.ah-list{display:grid;gap:8px}.ah-row{display:grid;grid-template-columns:135px 110px minmax(0,1fr) auto;gap:11px;align-items:start;padding:11px 12px;border:1px solid var(--border);border-left:4px solid #9cb0b9;border-radius:9px;background:#fff}.ah-row.calendar{border-left-color:#017db1}.ah-row.job{border-left-color:#7f90a0}.ah-row.work{border-left-color:#63b989}.ah-row.route{border-left-color:#b88735}.ah-row.error{border-left-color:#a6535d;background:#fff8f8}.ah-time{color:var(--muted);font-size:10px;line-height:1.4}.ah-type{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--brand-dark)}.ah-main strong{display:block;font-size:12px}.ah-main span{display:block;margin-top:3px;color:var(--muted);font-size:10px;line-height:1.45;white-space:pre-wrap}.ah-status{display:inline-block!important;width:max-content;margin-top:5px!important;padding:3px 7px;border-radius:999px;background:#eef3f5;color:var(--muted)!important;font-size:9px!important;font-weight:900}.ah-status.good{background:#edf7f1;color:#286344!important}.ah-status.warn{background:#faf5e7;color:#765b21!important}.ah-status.bad{background:#f9eeee;color:#873232!important}.ah-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.ah-actions button{padding:6px 8px;border:1px solid var(--border);border-radius:7px;background:var(--surface-soft);color:var(--brand-dark);font-size:10px;font-weight:900;cursor:pointer}.ah-empty{padding:25px;text-align:center;color:var(--muted);font-size:12px}.ah-loading{padding:20px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:850px){.ah-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.ah-row{grid-template-columns:1fr}.ah-search{margin-left:0;flex:1 1 100%}.ah-actions{justify-content:flex-start}}@media(max-width:520px){.ah-summary{grid-template-columns:1fr}}
</style>

<section class="view" id="view-activity">
  <div class="ah-layout">
    <div class="ah-toolbar panel">
      <button type="button" class="ah-filter active" data-ah-filter="all">All</button>
      <button type="button" class="ah-filter" data-ah-filter="work">Scheduled Work</button>
      <button type="button" class="ah-filter" data-ah-filter="calendar">Calendar Transactions</button>
      <button type="button" class="ah-filter" data-ah-filter="job">PMOS Jobs</button>
      <button type="button" class="ah-filter" data-ah-filter="route">Route Versions</button>
      <input id="ahSearch" class="ah-search" type="search" placeholder="Search activity">
      <button id="ahRefresh" type="button" class="button secondary">Refresh</button>
    </div>

    <div class="ah-summary">
      <div class="ah-metric"><span>Scheduled Work</span><strong id="ahMetricWork">—</strong></div>
      <div class="ah-metric"><span>Calendar Transactions</span><strong id="ahMetricCalendar">—</strong></div>
      <div class="ah-metric"><span>PMOS Jobs</span><strong id="ahMetricJobs">—</strong></div>
      <div class="ah-metric"><span>Route Versions</span><strong id="ahMetricRoutes">—</strong></div>
    </div>

    <article class="panel" style="padding:14px">
      <div class="panel-heading"><div><h2>Activity &amp; History</h2><p>Operational history across PMOS work, Calendar execution, jobs, and route versions.</p></div></div>
      <div id="ahList" class="ah-list"><div class="ah-loading">Loading history…</div></div>
    </article>
  </div>
</section>

<script>
(function(){
  'use strict';
  const state={initialized:false,loaded:false,filter:'all',data:{jobs:[],scheduledWork:[],calendarTransactions:[],routeVersions:[]},busy:false};
  const $=id=>document.getElementById(id);
  const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function call(name,...args){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error&&error.message?error.message:String(error))));runner[name](...args);});}
  function parseTime(value){const text=String(value||'').trim();if(!text)return 0;const direct=Date.parse(text);if(Number.isFinite(direct))return direct;const match=text.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})\s*([AP]M)$/i);if(!match)return 0;let hour=Number(match[4]);if(match[6].toUpperCase()==='PM'&&hour!==12)hour+=12;if(match[6].toUpperCase()==='AM'&&hour===12)hour=0;return new Date(Number(match[1]),Number(match[2])-1,Number(match[3]),hour,Number(match[5])).getTime();}
  function statusClass(value){const text=String(value||'').toUpperCase();if(/COMPLETE|VERIFIED|SCHEDULED|SUCCESS|CREATED/.test(text))return'good';if(/FAIL|ERROR/.test(text))return'bad';if(/PENDING|PAUSED|WAIT|STARTED|APPLIED/.test(text))return'warn';return'';}
  function activityItems(){const items=[];(state.data.scheduledWork||[]).forEach(item=>items.push({kind:'work',sortTime:parseTime(item.updatedAt||item.createdAt),time:item.updatedAt||item.createdAt,title:(item.workType==='SERVICE_CALL'?'Service Call':item.workType==='OPENING'?'Opening':'Closing')+' — '+(item.accountName||item.lastName||item.serviceLocationName||''),status:item.status,summary:[item.serviceLocationName,item.address,item.scheduledDate?('Scheduled '+item.scheduledDate+' · stop '+item.stopPosition):'',item.workSummary,item.lastError].filter(Boolean).join('\n'),id:item.workId,raw:item}));(state.data.calendarTransactions||[]).forEach(item=>items.push({kind:'calendar',sortTime:Number(item.sortTime||0)||parseTime(item.completedAt||item.startedAt),time:item.completedAt||item.startedAt,title:item.title||item.seriesKey||item.action||'Calendar transaction',status:item.status,summary:[item.action,item.layer,item.seriesKey,item.customerId?('Customer '+item.customerId):'',item.lastError].filter(Boolean).join(' · '),id:item.transactionId,raw:item}));(state.data.jobs||[]).forEach(item=>items.push({kind:'job',sortTime:parseTime(item.timestamp),time:item.timestamp,title:item.jobName||item.jobType||'PMOS Job',status:item.result,summary:[item.summary,item.processedItems?('Processed '+item.processedItems):'',item.batches?('Batches '+item.batches):''].filter(Boolean).join('\n'),id:item.jobId,raw:item}));(state.data.routeVersions||[]).forEach(item=>items.push({kind:'route',sortTime:Number(item.sortTime||0)||parseTime(item.timestamp),time:item.timestamp,title:item.label||'Route version',status:'Saved',summary:'Restorable route snapshot',id:item.id,raw:item}));return items.sort((a,b)=>b.sortTime-a.sortTime);}
  function render(){const query=$('ahSearch').value.trim().toLowerCase(),items=activityItems().filter(item=>(state.filter==='all'||item.kind===state.filter)&&(!query||[item.title,item.status,item.summary,item.id].join(' ').toLowerCase().includes(query)));$('ahMetricWork').textContent=(state.data.scheduledWork||[]).length;$('ahMetricCalendar').textContent=(state.data.calendarTransactions||[]).length;$('ahMetricJobs').textContent=(state.data.jobs||[]).length;$('ahMetricRoutes').textContent=(state.data.routeVersions||[]).length;$('ahList').innerHTML=items.length?items.map(renderRow).join(''):'<div class="ah-empty">No matching activity.</div>';bindActions();}
  function renderRow(item){const cls=statusClass(item.status),actions=[];if(item.kind==='route')actions.push('<button type="button" data-ah-action="restore" data-id="'+esc(item.id)+'">Restore</button>');if(item.kind==='work'&&(item.raw.lastError||item.raw.status==='PENDING_CALENDAR'||item.raw.status==='CALENDAR_CREATED'))actions.push('<button type="button" data-ah-action="retry" data-id="'+esc(item.id)+'">Retry Calendar</button>');return'<div class="ah-row '+esc(item.kind)+(cls==='bad'?' error':'')+'"><div class="ah-time">'+esc(item.time||'')+'</div><div class="ah-type">'+esc(item.kind==='work'?'Scheduled Work':item.kind==='calendar'?'Calendar':item.kind==='job'?'PMOS Job':'Route Version')+'</div><div class="ah-main"><strong>'+esc(item.title)+'</strong>'+(item.summary?'<span>'+esc(item.summary)+'</span>':'')+'<span class="ah-status '+cls+'">'+esc(item.status||'Recorded')+'</span></div><div class="ah-actions">'+actions.join('')+'</div></div>';}
  function bindActions(){$('ahList').querySelectorAll('[data-ah-action="restore"]').forEach(button=>button.onclick=()=>restoreRoute(button.dataset.id,button));$('ahList').querySelectorAll('[data-ah-action="retry"]').forEach(button=>button.onclick=()=>retryWork(button.dataset.id,button));}
  async function restoreRoute(id,button){if(!confirm('Restore this route version? PMOS will save the current routes first and mark restored layers pending for review.'))return;button.disabled=true;button.textContent='Restoring…';try{await call('restoreRouteVersion',id);document.dispatchEvent(new CustomEvent('pmos:refresh'));await load();}catch(error){alert(error.message);}finally{button.disabled=false;button.textContent='Restore';}}
  async function retryWork(id,button){button.disabled=true;button.textContent='Retrying…';try{await call('syncPmosScheduledWorkItem',id);document.dispatchEvent(new CustomEvent('pmos:refresh'));await load();}catch(error){alert(error.message);}finally{button.disabled=false;button.textContent='Retry Calendar';}}
  async function load(){if(state.busy)return;state.busy=true;$('ahRefresh').disabled=true;$('ahList').innerHTML='<div class="ah-loading">Loading PMOS history…</div>';try{state.data=await call('getPmosWebActivityHistory',75);state.loaded=true;render();}catch(error){$('ahList').innerHTML='<div class="ah-empty">'+esc(error.message)+'</div>';}finally{state.busy=false;$('ahRefresh').disabled=false;}}
  function init(){if(state.initialized)return;state.initialized=true;document.querySelectorAll('.ah-filter').forEach(button=>button.onclick=()=>{state.filter=button.dataset.ahFilter;document.querySelectorAll('.ah-filter').forEach(item=>item.classList.toggle('active',item===button));render();});$('ahSearch').addEventListener('input',render);$('ahRefresh').onclick=load;load();}
  document.addEventListener('pmos:viewchange',event=>{if(event.detail&&event.detail.name==='activity'){init();if(state.loaded)load();}});
  document.addEventListener('pmos:refresh',()=>{if(state.initialized)load();});
})();
</script>
